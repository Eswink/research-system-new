[project]
name = "research-system"
version = "0.4.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "docker==7.2.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "mcp>=1.28,<2",
    "opentelemetry-api==1.39.1",
    "opentelemetry-exporter-otlp-proto-common==1.39.1",
    "opentelemetry-exporter-otlp-proto-http==1.39.1",
    "opentelemetry-proto==1.39.1",
    "opentelemetry-sdk==1.39.1",
    "psycopg[binary]==3.2.13",
    "tenacity==9.1.4",
    "uvicorn==0.52.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "docker==7.2.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "mcp>=1.28,<2",
    "opentelemetry-api==1.39.1",
    "opentelemetry-exporter-otlp-proto-common==1.39.1",
    "opentelemetry-exporter-otlp-proto-http==1.39.1",
    "opentelemetry-proto==1.39.1",
    "opentelemetry-sdk==1.39.1",
    "psycopg[binary]==3.2.13",
    "pydantic==2.13.4",
    "starlette==1.6.0",
    "tenacity==9.1.4",
    "uvicorn==0.52.4",
    "import-linter>=2.13",
    "jsonschema>=4.26.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.2",
    "types-pyyaml>=6.0.12.20260724",
    "openhands-sdk==1.42.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
preview = true
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "node_modules",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I", "C90", "PLR0913", "PLR1702"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-nested-blocks = 4

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = [
    "packages",
    "adapters",
    "services",
    ".cursor/hooks/common.py",
    ".cursor/hooks/secret_guard.py",
    ".cursor/hooks/shell_guard.py",
    ".cursor/hooks/mcp_guard.py",
    ".cursor/hooks/subagent_guard.py",
    ".cursor/hooks/subagent_pretool_guard.py",
    ".cursor/skills/cursor-framework-check/scripts/run_all_checks.py",
    "tests",
]
exclude = ["^tests/architecture/python/fixtures/(invalid|valid)/"]

[[tool.mypy.overrides]]
# docker（docker-py）未发布 py.typed；对它的调用已收敛在 adapters/execution/。
module = ["docker", "docker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = ["--strict-config", "--strict-markers"]
markers = [
    "requires_docker: tests that need a running Docker daemon and the sandbox image",
    "requires_gpu: tests that need a real NVIDIA GPU + the pinned GPU sandbox image (M17)",
    "requires_live_llm: tests that need a real LLM endpoint (explicit manual runs only)",
    "postgres: tests that need a running PostgreSQL (docker-compose postgres service)",
    "requires_collector: tests that need the pinned OTel collector (docker-compose.m15.yml)",
    "distributed: M16 cross-process distributed-execution tests (subprocess workers + loopback gateway + PostgreSQL)",
]
