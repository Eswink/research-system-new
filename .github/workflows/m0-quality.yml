name: M0 Quality Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m0-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate Python lock
        run: uv lock --check

      - name: Sync frozen Python environment
        run: uv sync --frozen --dev

      - name: Prewarm the offline tokenizer cache
        # Environment preparation, not the gate (GOAL-011 EC-05).  Measured 2026-09-22 with an
        # unreachable proxy: the first `import litellm` requests the remote *model cost map*
        # and falls back to the bundled copy; a cold TIKTOKEN_CACHE_DIR showed no vocabulary
        # download.  Inside the gate, tests/conftest.py sets LITELLM_LOCAL_MODEL_COST_MAP before
        # any test module imports litellm, and tests/egress_guard.py refuses anything
        # non-loopback -- so this step keeps the gate genuinely offline without weakening it.
        # Same-source sentence (judged): "CI 每轮至多有一次受控外部下载".
        run: uv run --frozen --no-sync python -c "import litellm"

      - name: Sync frozen Node environment
        run: pnpm install --frozen-lockfile

      - name: Run all M0 gates
        run: >-
          uv run --frozen --no-sync python -B
          .cursor/skills/cursor-framework-check/scripts/run_all_checks.py
          --profile m0 --keep-going
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
          # D-13 / GOAL-017：**整进程资源阈值**判据（`tests/observability/test_telemetry_overhead.py`
          # 的 `_MAX_RSS_GROWTH_MIB` 与线程上限）移出本进程，改由 `observability-overhead` 作业
          # 单独执行。理由（两次实测）：4400+ 用例同进程留下的水位会把它顶到阈值之上——
          # 2026-09-25 `quality-windows-latest` 两次红都是这一条（174.0 MiB / 175.3 MiB，
          # 阈值 128 MiB），同代码复跑又绿。**判据与阈值一字未动**，只换执行进程。
          PYTEST_ADDOPTS: --ignore=tests/observability/test_telemetry_overhead.py

  observability-overhead:
    # D-13 / GOAL-017：整进程 RSS/线程阈值判据的**专用作业**。矩阵与 `quality` 一致 ⇒ 平台覆盖
    # 不减（windows 正是观察到这类红的地方）；判据本身、阈值、测量语义**均未改动**，
    # 且本作业失败 ⇒ 整个 workflow 失败（与拆分前同一条传播路径）。
    name: observability-overhead-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Validate Python lock
        run: uv lock --check

      - name: Sync frozen Python environment
        run: uv sync --frozen --dev

      - name: Prewarm the offline tokenizer cache
        # Environment preparation, not the gate (GOAL-011 EC-05).  Measured 2026-09-22 with an
        # unreachable proxy: the first `import litellm` requests the remote *model cost map*
        # and falls back to the bundled copy; a cold TIKTOKEN_CACHE_DIR showed no vocabulary
        # download.  Inside the gate, tests/conftest.py sets LITELLM_LOCAL_MODEL_COST_MAP before
        # any test module imports litellm, and tests/egress_guard.py refuses anything
        # non-loopback -- so this step keeps the gate genuinely offline without weakening it.
        # Same-source sentence (judged): "CI 每轮至多有一次受控外部下载".
        run: uv run --frozen --no-sync python -c "import litellm"

      - name: Run the whole-process resource-threshold judge alone
        run: >-
          uv run --frozen --no-sync python -B -m pytest
          tests/observability/test_telemetry_overhead.py
          -q
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8

  eval-gate:
    name: eval-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Validate Python lock
        run: uv lock --check

      - name: Sync frozen Python environment
        run: uv sync --frozen --dev

      - name: Prewarm the offline tokenizer cache
        # Environment preparation, not the gate (GOAL-011 EC-05).  Measured 2026-09-22 with an
        # unreachable proxy: the first `import litellm` requests the remote *model cost map*
        # and falls back to the bundled copy; a cold TIKTOKEN_CACHE_DIR showed no vocabulary
        # download.  Inside the gate, tests/conftest.py sets LITELLM_LOCAL_MODEL_COST_MAP before
        # any test module imports litellm, and tests/egress_guard.py refuses anything
        # non-loopback -- so this step keeps the gate genuinely offline without weakening it.
        # Same-source sentence (judged): "CI 每轮至多有一次受控外部下载".
        run: uv run --frozen --no-sync python -c "import litellm"

      - name: Run M11 deterministic eval gate
        run: >-
          uv run --frozen --no-sync python -B
          -m adapters.cli.eval_gate
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8

      - name: Run eval suite (no live LLM)
        run: >-
          uv run --frozen --no-sync python -B -m pytest tests/evals -q
          -m "not requires_live_llm"
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8

  container-quality:
    name: container-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Validate Python lock
        run: uv lock --check

      - name: Sync frozen Python environment
        run: uv sync --frozen --dev

      - name: Prewarm the offline tokenizer cache
        # Environment preparation, not the gate (GOAL-011 EC-05).  Measured 2026-09-22 with an
        # unreachable proxy: the first `import litellm` requests the remote *model cost map*
        # and falls back to the bundled copy; a cold TIKTOKEN_CACHE_DIR showed no vocabulary
        # download.  Inside the gate, tests/conftest.py sets LITELLM_LOCAL_MODEL_COST_MAP before
        # any test module imports litellm, and tests/egress_guard.py refuses anything
        # non-loopback -- so this step keeps the gate genuinely offline without weakening it.
        # Same-source sentence (judged): "CI 每轮至多有一次受控外部下载".
        run: uv run --frozen --no-sync python -c "import litellm"

      - name: Build sandbox image
        run: docker build -t research-os-sandbox:m9-test adapters/execution/sandbox

      - name: Run every Docker-marked test
        run: >-
          uv run --frozen --no-sync python -B -m pytest
          -m requires_docker
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8

  collector-quality:
    name: collector-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Validate Python lock
        run: uv lock --check

      - name: Sync frozen Python environment
        run: uv sync --frozen --dev

      - name: Prewarm the offline tokenizer cache
        # Environment preparation, not the gate (GOAL-011 EC-05).  Measured 2026-09-22 with an
        # unreachable proxy: the first `import litellm` requests the remote *model cost map*
        # and falls back to the bundled copy; a cold TIKTOKEN_CACHE_DIR showed no vocabulary
        # download.  Inside the gate, tests/conftest.py sets LITELLM_LOCAL_MODEL_COST_MAP before
        # any test module imports litellm, and tests/egress_guard.py refuses anything
        # non-loopback -- so this step keeps the gate genuinely offline without weakening it.
        # Same-source sentence (judged): "CI 每轮至多有一次受控外部下载".
        run: uv run --frozen --no-sync python -c "import litellm"

      - name: Start postgres + pinned OTel collector
        run: >-
          docker compose
          --project-directory .
          -f infra/compose/postgres-test.yaml
          -f infra/compose/otel-evidence.yaml
          up -d --build --wait

      - name: Run collector + PostgreSQL evidence and restart suites
        run: >-
          uv run --frozen --no-sync python -B -m pytest
          tests/observability
          tests/postgres
          tests/distributed
          tests/e2e/test_pg_crash_restart.py
          -m "requires_collector or postgres or distributed"
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
          RESEARCHOS_POSTGRES_DSN: postgresql://research_os:research_os_m14_test@localhost:15432/research_os
          RESEARCHOS_OTEL_COLLECTOR_ENDPOINT: http://localhost:4318
          RESEARCHOS_REQUIRE_COLLECTOR: "1"
          RESEARCHOS_REQUIRE_POSTGRES: "1"

  console-frontend:
    name: console-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Sync frozen environments
        run: |
          uv sync --frozen --dev
          pnpm install --frozen-lockfile

      - name: Web lint / typecheck / unit / build
        run: |
          pnpm --dir apps/web lint
          pnpm --dir apps/web typecheck
          pnpm --dir apps/web test
          pnpm --dir apps/web build

      - name: Install Playwright browsers (pinned)
        run: pnpm --dir apps/web exec playwright install --with-deps chromium

      - name: Console e2e (deterministic stubs)
        run: pnpm --dir apps/web test:e2e

      - name: Console live API e2e (Fake Ports)
        run: pnpm --dir apps/web test:e2e:live
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
          RESEARCHOS_POSTGRES_DSN: ""
