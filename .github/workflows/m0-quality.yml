name: M0 Quality Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m0-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate Python lock
        run: uv lock --check

      - name: Sync frozen Python environment
        run: uv sync --frozen --dev

      - name: Sync frozen Node environment
        run: pnpm install --frozen-lockfile

      - name: Run all M0 gates
        run: >-
          uv run --frozen --no-sync python -B
          .cursor/skills/cursor-framework-check/scripts/run_all_checks.py
          --profile m0 --keep-going
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8

  eval-gate:
    name: eval-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Validate Python lock
        run: uv lock --check

      - name: Sync frozen Python environment
        run: uv sync --frozen --dev

      - name: Run M11 deterministic eval gate
        run: >-
          uv run --frozen --no-sync python -B
          -m adapters.cli.eval_gate
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8

      - name: Run eval suite (no live LLM)
        run: >-
          uv run --frozen --no-sync python -B -m pytest tests/evals -q
          -m "not requires_live_llm"
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8

  container-quality:
    name: container-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Validate Python lock
        run: uv lock --check

      - name: Sync frozen Python environment
        run: uv sync --frozen --dev

      - name: Build sandbox image
        run: docker build -t research-os-sandbox:m9-test adapters/execution/sandbox

      - name: Run every Docker-marked test
        run: >-
          uv run --frozen --no-sync python -B -m pytest
          -m requires_docker
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8

  collector-quality:
    name: collector-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Validate Python lock
        run: uv lock --check

      - name: Sync frozen Python environment
        run: uv sync --frozen --dev

      - name: Start postgres + pinned OTel collector
        run: >-
          docker compose
          -f docker-compose.m14.yml
          -f docker-compose.m15.yml
          up -d --build --wait

      - name: Run collector + PostgreSQL evidence and restart suites
        run: >-
          uv run --frozen --no-sync python -B -m pytest
          tests/observability
          tests/postgres
          tests/e2e/test_pg_crash_restart.py
          -m "requires_collector or postgres"
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
          RESEARCHOS_POSTGRES_DSN: postgresql://research_os:research_os_m14_test@localhost:15432/research_os
          RESEARCHOS_OTEL_COLLECTOR_ENDPOINT: http://localhost:4318
          RESEARCHOS_REQUIRE_COLLECTOR: "1"
          RESEARCHOS_REQUIRE_POSTGRES: "1"
