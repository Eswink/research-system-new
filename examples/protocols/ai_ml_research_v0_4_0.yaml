id: ai_ml_research_v0_4_0
version: 0.4.0

phases:
  - id: intake
    strategy: deterministic
    outputs: [normalized_objective]

  - id: domain_discovery
    strategy: parallel_agents
    depends_on: [intake]
    task_contract: domain_discovery
    required_roles:
      - {role: domain_researcher, min_instances: 1, max_instances: 1}
      - {role: literature_scout, min_instances: 2, max_instances: 4}
    outputs: [domain_map, source_set]

  - id: evidence_modeling
    strategy: map_reduce
    depends_on: [domain_discovery]
    required_roles:
      - {role: evidence_curator, min_instances: 1, max_instances: 2}
    outputs: [evidence_set]

  - id: opportunity_exploration
    strategy: population_search
    depends_on: [evidence_modeling]
    required_roles:
      - {role: opportunity_explorer, min_instances: 1, max_instances: 2}
      - {role: idea_generator, min_instances: 2, max_instances: 6}
      - {role: skeptic, min_instances: 1, max_instances: 2}
    outputs: [idea_population]

  - id: experiment_design
    strategy: parallel_agents
    depends_on: [opportunity_exploration]
    required_roles:
      - {role: methodologist, min_instances: 1, max_instances: 1}
      - {role: experiment_designer, min_instances: 1, max_instances: 1}
    outputs: [experiment_plan]
    gate: QUALITY_GATE

  - id: execution
    strategy: iterative_optimizer
    depends_on: [experiment_design]
    task_contract: experiment_execution
    required_roles:
      - {role: experiment_engineer, min_instances: 1, max_instances: 2}
    outputs: [experiment_runs]
    stop_conditions:
      max_iterations: 8
      budget_exhausted: true

  - id: result_analysis
    strategy: parallel_agents
    depends_on: [execution]
    required_roles:
      - {role: result_analyst, min_instances: 1, max_instances: 2}
      - {role: statistician, min_instances: 1, max_instances: 1}
    outputs: [validated_results]

  - id: peer_review
    strategy: parallel_agents
    depends_on: [result_analysis]
    required_roles:
      - {role: scientific_reviewer, min_instances: 2, max_instances: 4}
      - {role: evidence_reviewer, min_instances: 1, max_instances: 1}
      - {role: methodology_reviewer, min_instances: 1, max_instances: 1}
    outputs: [review_findings]

  - id: meta_review
    strategy: single_agent
    depends_on: [peer_review]
    required_roles:
      - {role: meta_reviewer, min_instances: 1, max_instances: 1}
    outputs: [review_decision]

  - id: deliverable
    strategy: single_agent
    depends_on: [meta_review]
    required_roles:
      - {role: research_writer, min_instances: 1, max_instances: 1}
    outputs: [research_report]

  - id: final_audit
    strategy: parallel_agents
    depends_on: [deliverable]
    required_roles:
      - {role: reproducibility_auditor, min_instances: 1, max_instances: 1}
      - {role: citation_auditor, min_instances: 1, max_instances: 1}
    outputs: [audit_report]
    gate: QUALITY_GATE
