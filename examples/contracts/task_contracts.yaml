task_contracts:
  domain_discovery:
    version: 1.0.0
    purpose: Build a scoped domain map and source set.
    required_capabilities:
      - literature.search
      - literature.read
    input_schema: domain_discovery_input_v1
    output_schema: domain_discovery_output_v1
    budget:
      model_cost_usd: 12.00
      tool_requests: null
    acceptance_criteria:
      - type: SCHEMA_VALID
      - type: ARTIFACT_EXISTS
        artifact: source_set
      - type: EVIDENCE_COVERAGE
        minimum_sources: 10
    failure_policy:
      # 只声明**被消费**的键（GOAL-005 cycle 3 = EC-03）。这里曾同时写着
      # `on_validation_failure` 与 `allow_partial_evidence`，但两者都没有执行期
      # 消费者（验收门跑在任务行 durable 完成之后，改写一条 SUCCEEDED 行属 canonical
      # 状态机改动）——不生效的策略不进示例。待拍板的决策见
      # docs/adr/ADR-0030-validation-failure-consumption.md（Proposed）。用户契约里的
      # 未知键仍由 `failure_policy_view().unhonored` 点名，行为按缺省。
      on_task_failure: FAIL_RUN  # 缺省值，显式写出
    retry_policy:
      max_attempts: 3
      retryable_categories: [MODEL_RATE_LIMIT, TOOL_TIMEOUT]
      # 退避（PLAN-20260915-079）：第 n 次失败后等 min(30 * 2^(n-1), 300) 秒；
      # 这是"重排"与"再派发"之间唯一的时间间隔，没有它失败快的任务会热循环。
      backoff_seconds: 30
      max_backoff_seconds: 300

  experiment_execution:
    version: 1.0.0
    purpose: Execute a preregistered experiment in an isolated workspace.
    required_capabilities:
      - workspace.read
      - workspace.write.code
      - code.execute
      - artifact.write
    input_schema: experiment_run_input_v1
    output_schema: experiment_run_output_v1
    acceptance_criteria:
      - type: ARTIFACT_EXISTS
        artifact: metrics
      - type: TEST_PASSES
      - type: POLICY_COMPLIANT
    idempotency_scope: experiment_spec_digest
    # GOAL-011 EC-03：本合约**声明**「这件工作不是一次会话，而是由既有沙箱实验后端跑一次实验」。
    # 声明化（而不是按合约 id 硬编码派发）是这一轮的重点：把「谁执行」写成**契约事实**，
    # 派发方才不会因为写死了一个名字而漏掉语义相同的别的合约。
    # 空映射 = 声明已给出、脚本/镜像由**装配上下文**决定（本合约是通用实验合约，
    # 跑哪个脚本属调用方的事）；`m12_experiment_execution` 则把两者**pin**在契约里。
    experiment: {}
    retry_policy:
      max_attempts: 2
      retryable_categories: [WORKER_LOST, MODEL_RATE_LIMIT]

  m12_experiment_execution:
    version: 1.0.0
    purpose: M12 controlled experiment via DockerExecutionBackend (no ToolProvider gate, workspace via backend).
    required_capabilities: []
    input_schema: experiment_run_input_v1
    output_schema: experiment_run_output_v1
    acceptance_criteria:
      - type: ARTIFACT_EXISTS
        artifact: metrics
      - type: TEST_PASSES
      - type: POLICY_COMPLIANT
    idempotency_scope: experiment_spec_digest
    # GOAL-011 EC-03：同上——「谁执行」的声明。这一个把**脚本与镜像 pin 在契约里**
    # （M12 参考实验与 M9 沙箱镜像都是已 E2E 验证的既有资产）：装配方**不得**覆盖。
    experiment:
      script: examples/experiments/m12_reference_classification.py
      image: research-os-sandbox:m9-test
      command: python experiment.py
      timeout_seconds: 180
    retry_policy:
      max_attempts: 2
      retryable_categories: [WORKER_LOST, MODEL_RATE_LIMIT]

  console_demo_deliverable:
    version: 1.0.0
    purpose: M13-R1 console demo phase deliverable (controlled Fake agent loop output; UI 如实披露执行体性质).
    required_capabilities:
      - artifact.read
    output_schema: domain_discovery_output_v1
    acceptance_criteria:
      - type: ARTIFACT_EXISTS
        artifact: analysis_report
      - type: EVIDENCE_COVERAGE
        minimum_sources: 1
    retry_policy:
      max_attempts: 1
      retryable_categories: []

  real_research_deliverable:
    version: 1.0.0
    purpose: >-
      GOAL-010 EC-03：真实研究任务的交付物契约。**恰一个**声明产物（`ARTIFACT_EXISTS` 只有一条）
      ——这是 EC-01 的机制要求：声明唯一时 adapter 才把会话产出登记成合约声明的名字，
      多产物会回落事实名并判拒。**不加** `SCHEMA_VALID` / `TEST_PASSES`：今天诚实做不到的判据
      写进来只会让协议不可用（那是另一件事，不是「更严格」）。
    required_capabilities:
      - artifact.read
    output_schema: real_research_deliverable_v1
    acceptance_criteria:
      - type: ARTIFACT_EXISTS
        artifact: analysis_report
      - type: EVIDENCE_COVERAGE
        minimum_sources: 1
    retry_policy:
      max_attempts: 1
      retryable_categories: []

  real_retrieval_deliverable:
    version: 1.0.0
    purpose: >-
      GOAL-011 EC-02：**检索协议**（`real_retrieval_research_v1`）的交付物契约。与
      `real_research_deliverable` 的差别**只有一条**：覆盖判据多一个**来源性质**维度
      ——`minimum_retrieved_sources: 1` 要求被计的来源里**至少一条是系统取得**
      （`TrustLabel.RETRIEVED`，即运行链真的打到 provider 声明的 `network_domains`）。
      声明输入（`USER_PROVIDED`）**仍计入** `minimum_sources`，但**顶替不了**这条性质要求；
      模型自述（`GENERATED`）两条都不计入。**不动** `real_research_deliverable`：那份契约
      由没有检索的协议（`real_research_task_v1`）共用，给它加性质维度会让那些 run 全部判拒。
    required_capabilities:
      - artifact.read
    output_schema: real_research_deliverable_v1
    acceptance_criteria:
      - type: ARTIFACT_EXISTS
        artifact: analysis_report
      - type: EVIDENCE_COVERAGE
        minimum_sources: 1
        # 性质维度：总数够还不够，**得有一条是系统取回来的**。
        minimum_retrieved_sources: 1
    retry_policy:
      max_attempts: 1
      retryable_categories: []

  # GOAL-20260924-014 EC-01（cycle 1）：**声明补全**。
  #
  # `examples/protocols/sort_analysis_v1.yaml` 的两个 phase 引用
  # `task_contract: sort_analysis_execution` / `sort_analysis_review`，而这两份契约
  # 此前**只存在于测试夹具**（`tests/api/run_fixtures.py` 的
  # `replace_catalog_with_pins()` 用 `setdefault` 在运行期注入）。该协议是**产品面
  # 可选模板**（`services/api/routers/protocol_drafts.py` 的 `_TEMPLATE_SOURCES`
  # 第 1 条 =「Sort 分析（2-phase 参考）」）⇒ 出厂即不可用：任何走**真实控制面**
  # （`preflight_override` 缺席）的预检都会以两份 `TASK_CONTRACT_MISSING` 判 `FAIL`。
  #
  # 声明内容**逐字取自**夹具既有定义（`required_capabilities` / 验收判据 /
  # `timeout_seconds`），夹具那一行**未改**（补全后 `setdefault` 自然成为幂等兜底）。
  # `retry_policy` 取 `max_attempts: 1` + 空类别：夹具的域对象该字段为 `None`，而
  # `task_executor._retry_policy()` 对 `None` 的读法就是 `RetryPolicy(max_attempts=1)`
  # ⇒ 这是**同义**声明，不引入新的重试语义。
  #
  # `output_schema` 指向**既有的** `real_research_deliverable_v1`（会话交付物信封），
  # **不新造 schema 名**：那份额度的说明写死了它的口径——「字段取自
  # `adapters/openhands/runtime_adapter.py::_deliverable()` 真实登记的内容，**不是编出来的
  # 形状**」。这两份契约的 phase 是会话语义（未声明 `experiment`），运行期登记的就是这个
  # 信封（含 `contract_id` / `declared_artifact`，因此与合约无关、可被多份合约共用——
  # `console_demo_deliverable` 与 `real_retrieval_deliverable` 共用同一份 schema 是既有先例）。
  # 首版曾自造两个 schema 名，被 `framework/validate_bundle` 判红
  # （`TaskContract … 输出 Schema 不存在`）——那道门挡住的正是「声明了不存在的形状」。
  sort_analysis_execution:
    version: 1.0.0
    purpose: Analyze the input repository and produce a report artifact.
    required_capabilities:
      - workspace.read
      - workspace.write.code
      - code.execute
    output_schema: real_research_deliverable_v1
    acceptance_criteria:
      - type: ARTIFACT_EXISTS
        artifact: analysis_report
    timeout_seconds: 120
    retry_policy:
      max_attempts: 1
      retryable_categories: []

  sort_analysis_review:
    version: 1.0.0
    purpose: Independently review the analysis report.
    required_capabilities:
      - workspace.read
      - evidence.read
    output_schema: real_research_deliverable_v1
    acceptance_criteria:
      - type: EVIDENCE_COVERAGE
        minimum_sources: 1
    timeout_seconds: 120
    retry_policy:
      max_attempts: 1
      retryable_categories: []

  # GOAL-20260927-027 EC-04（多 role 科研子迭代）：新增两份契约，**不改**上面任何一份。
  #
  # 为什么需要它们：`sort_analysis_*` 两份契约服务 M7 那条 2-phase 参考场景（执行 + 复核），
  # 而 EC-04 的协议要**三个会话 phase、三个不同 role**，且评审要能对**上游留下的
  # 检索来源**作出真判定。复用既有契约会把 EC-04 的形状塞进 M7 场景的语义里
  # （`sort_analysis_review` 的 `minimum_sources: 1` 只数条数、不看性质）。
  #
  # 两份都指向**既有的** `real_research_deliverable_v1`（会话交付物信封），不新造 schema 名
  # （首版自造 schema 名会被 `framework/validate_bundle` 判红，见上面 `sort_analysis_*` 的注释）。
  multi_role_scouting:
    version: 1.0.0
    purpose: >-
      EC-04 侦察 phase 的交付物契约：产物存在 + 覆盖里至少一条**系统取得**的来源
      （运行链的两条 `europe_pmc` 检索证据满足性质维）。
    required_capabilities:
      - artifact.read
    output_schema: real_research_deliverable_v1
    acceptance_criteria:
      - type: ARTIFACT_EXISTS
        artifact: scouting_report
      - type: EVIDENCE_COVERAGE
        minimum_sources: 1
        # 性质维度：总数够还不够，**得有一条是系统取回来的**（与 GOAL-011 同口径）。
        minimum_retrieved_sources: 1
    timeout_seconds: 120
    retry_policy:
      max_attempts: 1
      retryable_categories: []

  multi_role_review:
    version: 1.0.0
    purpose: >-
      EC-04 评审 phase 的交付物契约：独立复核**以自己的判定依据为准** ——
      评审交付物存在，且它声明输入的那份材料在场、可复核（`EVIDENCE_COVERAGE:
      minimum_sources` 数的是**本任务**能看到的非自产来源）。
      **为什么这里不声明 `minimum_retrieved_sources`**（如实边界）：性质维度数的是
      **本任务自己**的系统取得来源，而评审 phase 不做检索 —— 要求它就等于要求评审者
      为自己没做的事背书。检索那一维由**侦察 phase** 的契约（`multi_role_scouting`）
      承担，那里才有 `minimum_retrieved_sources: 1`。评审「评为不通过」的实测用例见
      `tests/e2e/test_multi_role_research_offline.py` 的反证分支（去掉声明输入 ⇒
      评审 phase 判 `0 < 1 sources` 并点名）。
    required_capabilities:
      - artifact.read
      - evidence.read
    output_schema: real_research_deliverable_v1
    acceptance_criteria:
      - type: ARTIFACT_EXISTS
        artifact: review_decision
      - type: EVIDENCE_COVERAGE
        minimum_sources: 1
    timeout_seconds: 120
    retry_policy:
      max_attempts: 1
      retryable_categories: []

  # GOAL-20261005-030 EC-01：**承接能力真的被一次 run 用上**的成对契约。
  #
  # 两份契约的分工（缺一不可）：
  #   * `capabilities_used_probe`  —— 上游：三条承接读能力（`artifact.read` /
  #     `evidence.read` / `workspace.read`）由**运行链**执行，产出落 canonical。
  #   * `capabilities_used_review` —— 下游：**消费**上游留下的东西 —— 它经运行链读
  #     本 run 的证据投影，而那份投影里含有上游工具调用登记的证据（同源两步：证据
  #     按 claim relation 投影）。「调了但没人用」因此不成立。
  #
  # `required_capabilities` **逐条列举**是与 `policy.yaml` 同源的要求（`policy_scope_for`
  # 按能力给出求值 scope）：只有列在这里的能力才会进 `tool_requirements`（preflight 的
  # 策略/健康/pin 判定面），也只列**已放行**的那些 —— GOAL-029 承接的另五条读能力
  # 没有 `allow` 规则，列进来会让差集判据判红（属 `D-02(b)` 待拍板，见 GOAL 记录）。

  capabilities_used_probe:
    version: 1.0.0
    purpose: >-
      EC-01 上游 phase 的交付物契约：三条承接读能力的运行链调用产出可复核的探针交付物。
      验收只判「产物存在」与「覆盖里至少一条非自产来源」——**不**判内容质量
      （与既有真实契约同一条诚实边界：今天做不到的判据写进来只会让协议不可用）。
    required_capabilities:
      - artifact.read
      - evidence.read
      - workspace.read
    output_schema: real_research_deliverable_v1
    acceptance_criteria:
      - type: ARTIFACT_EXISTS
        artifact: probe_report
      - type: EVIDENCE_COVERAGE
        minimum_sources: 1
    timeout_seconds: 120
    retry_policy:
      max_attempts: 1
      retryable_categories: []

  capabilities_used_review:
    version: 1.0.0
    purpose: >-
      EC-01 下游 phase 的交付物契约：独立复核以上游留下的 canonical 事实为依据。
      它声明与上游**同一组**三条读能力（同一份改写：会话工具面因此为空，生产装配
      无需 provider→SDK 映射即可起会话），并**真的读回**上游的工具证据。
    required_capabilities:
      - artifact.read
      - evidence.read
      - workspace.read
    output_schema: real_research_deliverable_v1
    acceptance_criteria:
      - type: ARTIFACT_EXISTS
        artifact: review_decision
      - type: EVIDENCE_COVERAGE
        minimum_sources: 1
    timeout_seconds: 120
    retry_policy:
      max_attempts: 1
      retryable_categories: []

  # GOAL-20261005-030 EC-03：**科研动作深度**的成对契约。
  #
  # 与 EC-01 那两份的差别**只有一条**：中间多一个**真科研动作**（沙箱实验）并给它下
  # 一道**可否证**的判据。前两 phase 的读能力与 EC-01 同一组（只用已放行的三条）。

  scientific_action_probe:
    version: 1.0.0
    purpose: >-
      EC-03 上游 phase：把本 run 的 grounding 读进来（声明输入 + 证据投影 + 工作区视图），
      为后面的真实实验留下可复核的起点。三条读能力由运行链执行。
    required_capabilities:
      - artifact.read
      - evidence.read
      - workspace.read
    output_schema: real_research_deliverable_v1
    acceptance_criteria:
      - type: ARTIFACT_EXISTS
        artifact: probe_report
      - type: EVIDENCE_COVERAGE
        minimum_sources: 1
    timeout_seconds: 120
    retry_policy:
      max_attempts: 1
      retryable_categories: []

  scientific_action_experiment:
    version: 1.0.0
    purpose: >-
      EC-03 的**真科研动作**：在隔离容器里跑一次确定性基准实验（精确重复检测：
      两两比较 vs 哈希索引），产出的 `metrics` 是结构化科学指标。
    required_capabilities:
      - workspace.read
      - workspace.write.code
      - code.execute
      - artifact.write
    input_schema: experiment_run_input_v1
    output_schema: experiment_run_output_v1
    # `experiment: {}` = 声明已给出、脚本/镜像由**装配上下文**决定（与既有
    # `experiment_execution` 同一条既有语义；本合约不 pin 那两个量）。
    experiment: {}
    acceptance_criteria:
      - type: ARTIFACT_EXISTS
        artifact: metrics
      - type: TEST_PASSES
      - type: POLICY_COMPLIANT
      # **可否证的科研判据**（本 EC 的核心）：哈希索引必须把比较次数至少降两个数量级。
      # 度量取自实验产物**自报**的 `comparison_reduction_ratio`（`experiment_gate_inputs`
      # 的既有投影）；本合约对该量下**真实阈值** —— 实验若真没把比较次数降下来，
      # 这道判据**判拒并点名那个数**（`metric … missing` 或
      # `comparison_reduction_ratio=<值> GTE 100` 的逐条判词）。阈值不是装饰：
      # 语料规模 800 条、注入 40 对重复 ⇒ 两两比较 319,600 次而索引桶内比较极少，
      # 数量级差距是这条实验**本来就该有**的结论。
      - type: METRIC_THRESHOLD
        metric: comparison_reduction_ratio
        operator: GTE
        threshold: 100
    timeout_seconds: 300
    retry_policy:
      max_attempts: 1
      retryable_categories: []

  scientific_action_verdict:
    version: 1.0.0
    purpose: >-
      EC-03 下游 phase：在实验**之后**读本 run 的证据投影 —— 返回内容里因此含实验那次
      工具证据（`experiment_run_id` 在证据上）⇒ 「跑完没人看」不成立。
    required_capabilities:
      - artifact.read
      - evidence.read
      - workspace.read
    output_schema: real_research_deliverable_v1
    acceptance_criteria:
      - type: ARTIFACT_EXISTS
        artifact: review_decision
      - type: EVIDENCE_COVERAGE
        minimum_sources: 1
    timeout_seconds: 120
    retry_policy:
      max_attempts: 1
      retryable_categories: []

  # GOAL-20261006-031 EC-01(e)：**本轮放行的读能力真的被用**的成对契约。
  #
  # 与 `capabilities_used_*` 那两份的关系：后者证「GOAL-029 的三条已放行读能力被用」；
  # 本对证「**本轮新放行的读能力**被用」（三条由运行链执行 + 下游消费它们的产出）。
  # `required_capabilities` **逐条列举**（`policy_scope_for` 按能力给出求值 scope）；
  # 只列**已放行**的能力 —— 这是本协议可被 preflight 放行的前提。

  granted_reads_probe:
    version: 1.0.0
    purpose: >-
      EC-01(e) 上游 phase：本轮放行的两条只读能力（`run.read` / `budget.read`）由
      **运行链**执行，产出落 canonical（工具证据 + 内容寻址制品）。
    required_capabilities:
      - run.read
      - budget.read
    output_schema: real_research_deliverable_v1
    acceptance_criteria:
      - type: ARTIFACT_EXISTS
        artifact: probe_report
      - type: EVIDENCE_COVERAGE
        minimum_sources: 1
    timeout_seconds: 120
    retry_policy:
      max_attempts: 1
      retryable_categories: []

  granted_reads_review:
    version: 1.0.0
    purpose: >-
      EC-01(e) 下游 phase：**消费**上游留下的东西 —— `claim.read` 读本 run 的 claim 与
      relation、`evidence.read` 读本 run 的证据投影；两者都由运行链在 probe 登记**之后**
      执行 ⇒ 返回内容里含上游工具证据（「调了但没人用」不成立）。
    required_capabilities:
      - claim.read
      - evidence.read
    output_schema: real_research_deliverable_v1
    acceptance_criteria:
      - type: ARTIFACT_EXISTS
        artifact: review_decision
      - type: EVIDENCE_COVERAGE
        minimum_sources: 1
    timeout_seconds: 120
    retry_policy:
      max_attempts: 1
      retryable_categories: []

  # GOAL-20261006-031 EC-03：**两轮派生**（`two_round_research_loop_v1`）的两份契约。
  #
  # 与 `granted_reads_*` 那两份的关系：那对证「本轮新放行的读能力被用」；本对证
  # 「**第二轮的问题由第一轮的结果派生**」—— round2 的运行链步先经**读面**拿到
  # round1 的产出制品，再按声明路径从中取标识做第二次检索/读取。
  #
  # 两轮的 `required_capabilities` **逐条列举**（`policy_scope_for` 按能力给出求值
  # scope），全部是**已放行**能力 —— 这是本协议可被 preflight 放行的前提。
  # `output_schema` 指向**既有**的 `real_research_deliverable_v1`（会话交付物信封，
  # 与 `granted_reads_*` / `sort_analysis_*` 共用同一份既有多用途 schema 是既有先例）。
  #
  # 覆盖判据只判**产物存在 + 来源覆盖**（不判内容质量）：两轮的来源都来自各自的
  # 声明输入与运行链取得的证据 —— 与全仓既有真实契约同一条诚实边界。

  two_round_round_one:
    version: 1.0.0
    purpose: >-
      EC-03 第一轮：读本 run 的证据投影（`evidence.read`）并做一次真实检索
      （`literature.search`，`query` 取自声明输入）—— 检索结果成为**第二轮的派生来源**。
    required_capabilities:
      - artifact.read
      - evidence.read
      - literature.search
    output_schema: real_research_deliverable_v1
    acceptance_criteria:
      - type: ARTIFACT_EXISTS
        artifact: round_one_findings
      - type: EVIDENCE_COVERAGE
        minimum_sources: 1
    timeout_seconds: 120
    retry_policy:
      max_attempts: 1
      retryable_categories: []

  two_round_round_two:
    version: 1.0.0
    purpose: >-
      EC-03 第二轮：经**读面**（`evidence.read` → `artifact.read`）读到第一轮的
      检索产出，再按声明路径取标识做第二次读取（`literature.read`）—— 第二轮的问题
      因此**派生自第一轮的结果**（不是操作者手写）。
    required_capabilities:
      - artifact.read
      - evidence.read
      - literature.read
    output_schema: real_research_deliverable_v1
    acceptance_criteria:
      - type: ARTIFACT_EXISTS
        artifact: round_two_followup
      - type: EVIDENCE_COVERAGE
        minimum_sources: 1
    timeout_seconds: 120
    retry_policy:
      max_attempts: 1
      retryable_categories: []

  # GOAL-20261008-035 EC-03（评审联动）：**声明 `REVIEW_SCORE` 的出厂合约**。
  #
  # 为什么新增而不是给 `sort_analysis_review` 加判据：那份契约服务 M7 的 2-phase 参考
  # 场景，其结构化输出在多条既有判据与夹具里被复用；加一条新判据会让那些夹具的评审输出
  # 变成「缺分数」⇒ 既有判据连环判负（改的是既有受判面，不是本 EC 要的东西）。
  # 本契约**指向既有** `real_research_deliverable_v1` 信封，不新造 schema 名。
  review_scored_deliverable:
    version: 1.0.0
    purpose: >-
      交付一件评审决定，并让**评审判给自己的分数**参与验收判定（评审联动）。
    required_capabilities:
      - artifact.write
    output_schema: real_research_deliverable_v1
    acceptance_criteria:
      - type: ARTIFACT_EXISTS
        artifact: review_decision
      # 分数**来源被点名**：`review_decision.score`（会话结构化输出里那件交付物的
      # `score` 字段）。取不到 ⇒ 既有 fail-closed `review score unknown`，**不**回落默认分。
      - type: REVIEW_SCORE
        metric: review_decision.score
        operator: GTE
        threshold: 0.8
    timeout_seconds: 120
    retry_policy:
      max_attempts: 1
      retryable_categories: []

  # GOAL-20261008-036 EC-03（承接面真用）：**消费已落库评审结论**的那件交付物。
  #
  # 为什么新增而不是改 `review_scored_deliverable`：那份契约的判据（`ARTIFACT_EXISTS`
  # + `REVIEW_SCORE`）被 GOAL-035 EC-03 的判据与夹具逐字复用；给它加判据会改动那份
  # 受判面。本契约只加一条「它确实交付了一件元评审」的存在性判据（**不判内容质量** ——
  # 与 `real_research_deliverable_v1` 的诚实边界同一条）。
  cross_run_consumption_deliverable:
    version: 1.0.0
    purpose: >-
      交付一件「基于**程序内前序 run 落库的结论**作出的元评审」—— 跨 run 消费面
        （`research_state.read`，GOAL-20261008-037 EC-03）真的被用上的那件交付物。
      **GOAL-20261008-038 EC-04**：本合约**声明它消费了什么** —— `CUSTOM_EVALUATOR`
      判据用 `metric` 指明「本轮产物里哪条路径承载前序结论」，由编排层求值器按
      **结构化比对**判定（相等 ⇒ 消费成立并留痕；不等 ⇒ 判负并点名两侧值）。
    required_capabilities:
      - artifact.write
    output_schema: real_research_deliverable_v1
    acceptance_criteria:
      - type: ARTIFACT_EXISTS
        artifact: meta_review
      # 声明的**消费**判据：本轮的 `meta_review` 交付物必须携带前序 run 的落库结论
      # （路径 `metric` 逐字给出；求值器 id `evaluator` 逐字给出）。
      - type: CUSTOM_EVALUATOR
        evaluator: cross_run_consumption
        metric: meta_review.prior_verdict
    timeout_seconds: 120
    retry_policy:
      max_attempts: 1
      retryable_categories: []

  review_consumption_deliverable:
    version: 1.0.0
    purpose: >-
      交付一件「基于**本 run 已落库的验收结论**作出的元评审」—— 消费面（`review.read`）
      真的被用上的那件交付物。
    required_capabilities:
      - artifact.write
    output_schema: real_research_deliverable_v1
    acceptance_criteria:
      - type: ARTIFACT_EXISTS
        artifact: meta_review
    timeout_seconds: 120
    retry_policy:
      max_attempts: 1
      retryable_categories: []
