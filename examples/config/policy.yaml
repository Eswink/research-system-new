policy:
  default_effect: DENY

  allow:
    - capability: workspace.read
      scope: project
    - capability: artifact.read
      scope: project
    # GOAL-20260924-014 EC-01（用户已拍板方案 (A)）：放行这一条**读能力**，
    # 消灭「同一协议两套装配两个结论」（真实控制面对 sort_analysis_v1 的
    # evidence.read 落 default_effect ⇒ FAIL，live 装配 ⇒ WARN）。scope 与同级
    # 读能力 artifact.read 对齐：evidence.read 的 provider 是 m12_artifact
    # （BUILT_IN / READ_ONLY），与 artifact.read 同一个 provider。
    # 本改动**只**新增这一条 allow；default_effect / deny / require_approval /
    # allow_with_constraints 一律未动。
    - capability: evidence.read
      scope: project
    # GOAL-20261006-031 EC-01（授权 1）：**已承接但未放行**的 6 条**只读**能力逐条放行。
    # 它们都有真实现（`adapters/canonical/read_provider.py` / `run_read.py`）、都在出厂
    # 绑定表内，此前落 `default_effect: DENY` ⇒ 写进任何协议的 `required_capabilities`
    # 都会被判成「协议可达却无放行规则」（GOAL-030 实测的受限面）。
    # 逐条放行、**不成类**（承 GOAL-016 EC-02 的 D-02(b) 口径：一条规则只命名一个具体能力）；
    # scope 与同级读能力 `artifact.read` / `evidence.read` 对齐 = `project`。
    # **本改动只新增这 6 条 allow**：`default_effect` / `deny` / `require_approval` /
    # `allow_with_constraints` 一律未动（由新增判据逐条钉住）。
    - capability: run.read
      scope: project
    - capability: claim.read
      scope: project
    - capability: deliverable.read
      scope: project
    - capability: budget.read
      scope: project
    - capability: experiment.read
      scope: project
    - capability: experiment_plan.read
      scope: project
    # GOAL-20261008-036 EC-02（授权 承继 (0) 的「可以决定」面）：`review.read` 的放行 ——
    # 它读的是 GOAL-035 EC-01 落 canonical 的**验收结论**（逐条判词），与读面
    # `GET /runs/{id}/reviews` 同一内容面；scope 与同级读能力（`artifact.read` /
    # `evidence.read` / `run.read`）对齐 = `project`。
    # **本改动只新增这一条 allow**：`default_effect` / `deny` / `require_approval` /
    # `allow_with_constraints` 一律未动（由新增判据逐条钉住）。
    - capability: review.read
      scope: project
    # GOAL-20261008-037 EC-03：`research_state.read` 的放行 —— 只读（聚合读**程序内
    # 前序 run** 的落库结论）。scope 与同级读能力（review.read / run.read / artifact.read）
    # 对齐 = `project`。**本改动只新增这一条 allow**：`default_effect` / `deny` /
    # `require_approval` / `allow_with_constraints` 一律未动。
    - capability: research_state.read
      scope: project
    # GOAL-20261009-042 EC-02：`memory.read` 的放行 —— **只读**（读 governed memory 并按
    # **调用方给的时点**给出时效与处置；判定不读挂钟）。scope 与同级读能力
    # （`research_state.read` / `review.read` / `run.read`）对齐 = `project`。
    # **本改动只新增这一条 allow**：`default_effect` / `deny` / `require_approval` /
    # `allow_with_constraints` 一律未动；写面（`memory.write` 的四条 tier allow）逐字保持。
    - capability: memory.read
      scope: project
    - capability: artifact.write
      scope: run
    - capability: literature.search
      scope: approved_tool_providers
    - capability: literature.read
      scope: approved_tool_providers
    # GOAL-20261006-031 EC-02（授权 2）：`citation.validate` 的放行。scope 与**同一取数
    # provider 的既有放行形态**对齐（`approved_tool_providers` —— `literature.search` /
    # `literature.read` 就是这一组）；`citation.validate` 是 `citation.inspect` 的**判定层**，
    # 取数仍走同一个 elink 面。本改动只新增这一条 allow。
    - capability: citation.validate
      scope: approved_tool_providers
    - capability: network.academic
      scope: approved_domains
    # Memory 写入按 tier 显式放行（PLAN-20260914-049，G16）：默认保持既有行为
    # （PROJECT/ORGANIZATION 的审批仍由门链 curator 门承担，不在此重复）；运维可
    # 在此对某 tier 收紧为 deny / require_approval（门链 policy 阶段实时生效）。
    - capability: memory.write
      scope: SESSION
    - capability: memory.write
      scope: RUN
    - capability: memory.write
      scope: PROJECT
    - capability: memory.write
      scope: ORGANIZATION

  allow_with_constraints:
    - capability: workspace.write.notes
      constraints: {path_prefix: /notes}
    - capability: workspace.write.code
      constraints: {requires_workspace_lease: true, path_prefix: /code}
    - capability: code.execute
      constraints: {sandbox_required: true, max_seconds: 1800}

  require_approval:
    - capability: package.install
    - capability: workspace.delete
    - capability: external.publish
    - action: TOOL_PACK_INSTALL_OR_UPDATE
    - action: MODEL_OR_TOOLSET_CHANGE_DURING_RUN

  deny:
    - capability: network.public
    - action: MOUNT_DOCKER_SOCKET
    - action: PRIVILEGED_CONTAINER
