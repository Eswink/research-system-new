llm_endpoints:
  main:
    name: Main Relay
    protocol: OPENAI_COMPATIBLE
    base_url: https://xxx.com/api/v1
    credential_ref: llm_main_key
    request_timeout_seconds: 120
    max_retries: 2
    concurrency_limit: 8
    enabled: true
    discovery:
      enabled: true
      allow_models:
        - model-alpha
    circuit_breaker:
      failure_threshold: 5
      open_timeout_seconds: 60
      half_open_max_probes: 1