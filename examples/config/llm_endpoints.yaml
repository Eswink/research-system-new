llm_endpoints:
  main:
    name: Main Relay
    protocol: OPENAI_COMPATIBLE
    base_url: https://discovery-api.intern-ai.org.cn/v1
    credential_ref: LLM_MAIN_KEY
    request_timeout_seconds: 120
    max_retries: 2
    concurrency_limit: 8
    enabled: true
    discovery:
      enabled: true
      allow_models:
        - deepseek-v4-flash-vision
    circuit_breaker:
      failure_threshold: 5
      open_timeout_seconds: 60
      half_open_max_probes: 1

  agnes-anthropic:
    name: Intern Anthropic
    protocol: ANTHROPIC
    base_url: https://discovery-api.intern-ai.org.cn/v1
    credential_ref: LLM_MAIN_KEY
    request_timeout_seconds: 120
    max_retries: 2
    concurrency_limit: 4
    enabled: true
    discovery:
      enabled: false
