models:
  # ===========================================================================
  # GOAL-20261119-115 EC-01：**只允许零价模型**。
  #
  # 四个模型名来自 `GET https://opencode.ai/inference/go/v1/models` 的实测读数
  # （2026-11-20，`cost.text.input.price == 0` 且 `cost.text.output.price == 0`）：
  #   hy4-flash-free · longcat-2.5-free · beam-free · iceman-contributor-free
  # 判据 `tests/loaders/test_free_model_only_policy.py` 把这份文件与**离线夹具里的
  # 零价集合**逐字对拍：收费名进来即判红并点名。
  #
  # **能力按实测声明，不按 provider 的声称**（既有纪律）：
  # | 模型 | context | tools | structured_output（实测 `response_format: json_schema`）|
  # | --- | --- | --- | --- |
  # | hy4-flash-free | 1048576 | ✅ 标准 `tool_calls` | ✅ 只回 schema 内的键 |
  # | longcat-2.5-free | 1000000 | ✅ | ✅ |
  # | beam-free | 1048576 | ✅ | ✅（provider 也声称） |
  # | iceman-contributor-free | 262144 | ✅ | ❌ **400 Structured response_format is not enabled** |
  # ⇒ `iceman-contributor-free` **不**声明 `STRUCTURED_OUTPUT_NATIVE`；
  # 另外 `longcat-2.5-free` 的 `temperature` 被 provider 标为不支持（`false`）⇒
  # 它只在不需要采样参数的角色上用。
  #
  # 附注（实测，写在配置里是为了下一次换站能复用）：`hy4-flash-free` 是 reasoning 模型，
  # `max_tokens=256` 时 `finish_reason: length` 且 `tool_calls` 为空 —— 给它工具面时
  # 输出预算要 ≥ 2048（`max_tokens=2048` 实测正常返回 `tool_calls`）。
  # ===========================================================================

  # --- 写作组（`research_strong` / `research_fast` 的生产侧；WRITER 面） --------
  agnes_flash:
    endpoint: main
    display_name: Hy4 Flash Free (relay, writing/execution)
    model_name: hy4-flash-free  # 写作组
    context_window_tokens: 1048576  # `limit.context`（input 983040 / output 65536）
    thinking_intensity: MAX
    capabilities:
      CHAT: &user_declared_supported
        status: SUPPORTED
        confidence: 0.5
        source: USER_DECLARED
        last_verified_at: null
        probe_version: null
      STREAMING: *user_declared_supported
      TOOL_CALLING_NATIVE: *user_declared_supported
      STRUCTURED_OUTPUT_NATIVE: *user_declared_supported
      USAGE_REPORTING: *user_declared_supported

  research_alpha:
    endpoint: main
    display_name: Research Alpha
    model_name: hy4-flash-free  # 写作组（writer/director/domain_a）
    capabilities:
      CHAT: *user_declared_supported
      STREAMING: *user_declared_supported
      TOOL_CALLING_NATIVE: *user_declared_supported
      STRUCTURED_OUTPUT_NATIVE: *user_declared_supported
      USAGE_REPORTING: *user_declared_supported

  coding_beta:
    endpoint: main
    display_name: Coding Beta
    model_name: hy4-flash-free  # 写作组
    capabilities:
      CHAT: *user_declared_supported
      STREAMING: *user_declared_supported
      TOOL_CALLING_NATIVE: *user_declared_supported

  # 轻量面（`scout_b` / `research_fast`）。**不是评审面**：它是 `model_profiles`
  # 里 `research_fast.primary` 的落点，为写作/侦察侧提供第二个执行目标。
  reviewer_gamma:
    endpoint: main
    display_name: LongCat 2.5 Free (relay, light/scouting)
    model_name: longcat-2.5-free
    capabilities:
      CHAT: *user_declared_supported
      STREAMING: *user_declared_supported
      STRUCTURED_OUTPUT_PROMPTED: *user_declared_supported
      TOOL_CALLING_NATIVE: *user_declared_supported

  # --- 评审 A（`critic_independent.primary`）--------------------------------
  # **底层 model_name 与生产者不同**（`beam-free` vs `hy4-flash-free`），这是
  # 「评审独立于生产者」可判的前提（`check_heterogeneity` + 工厂判据逐对判不交）。
  reviewer_independent:
    endpoint: main
    display_name: Beam Free (third-party reviewer A)
    model_name: beam-free
    context_window_tokens: 1048576  # `limit.context`（output 131072）
    capabilities:
      CHAT: *user_declared_supported
      STREAMING: *user_declared_supported
      TOOL_CALLING_NATIVE: *user_declared_supported
      STRUCTURED_OUTPUT_NATIVE: *user_declared_supported
      USAGE_REPORTING: *user_declared_supported

  # --- 评审 B（`max_instances: 2` 的评审 panel 的第二个成员）----------------
  # 与评审 A **不同目标**（`longcat-2.5-free` vs `beam-free`）—— 两位评审者彼此
  # 也不同模型，`panel_verdict.independent` 因此在目录声明上就成立。
  kimi_k2_6:
    endpoint: main
    display_name: LongCat 2.5 Free (third-party reviewer B)
    model_name: longcat-2.5-free
    context_window_tokens: 1000000
    capabilities:
      CHAT: *user_declared_supported
      STREAMING: *user_declared_supported
      TOOL_CALLING_NATIVE: *user_declared_supported
      STRUCTURED_OUTPUT_NATIVE: *user_declared_supported
      USAGE_REPORTING: *user_declared_supported

  # --- 创新点评审 -----------------------------------------------------------
  # **与评审 A 同目标**（`beam-free`）：这是 GOAL-20261111-108 由用户拍板放宽的那一面
  # （四个零价模型不够三方互斥 + 作者独立）。`test_the_shared_review_target_is_recorded`
  # 把它逐字登记为可读事实；`test_the_novelty_reviewer_is_not_on_the_writing_side`
  # 守住**没有**放宽的那一面（不得落到写作组）。
  novelty_review_model:
    endpoint: main
    display_name: Beam Free (third-party novelty reviewer)
    model_name: beam-free
    context_window_tokens: 1048576
    capabilities:
      CHAT: *user_declared_supported
      STREAMING: *user_declared_supported
      TOOL_CALLING_NATIVE: *user_declared_supported
      USAGE_REPORTING: *user_declared_supported

  # --- 创新点作者（`novelty_author`）--------------------------------------
  # 必须独立于写作组与三位评审者 ⇒ 落到唯一剩下的零价模型
  # `iceman-contributor-free`（契约：`test_the_author_agent_is_bound_to_a_fifth_distinct_model`）。
  # **非 ZDR**：provider 明示 prompt 会用于改进模型；用户 2026-11-18 已授权，
  # 该事实写进 `docs/product/PRD_GAP_ANALYSIS.md`（EC-07）。
  # **不**声明 `STRUCTURED_OUTPUT_NATIVE`：实测 `response_format: json_schema` 被拒
  # （400 `Structured response_format is not enabled`）。
  novelty_author_model:
    endpoint: main
    display_name: Iceman Contributor Free (novelty author)
    model_name: iceman-contributor-free
    context_window_tokens: 262144  # `limit.context`（output 131072；四个里最小）
    capabilities:
      CHAT: *user_declared_supported
      STREAMING: *user_declared_supported
      TOOL_CALLING_NATIVE: *user_declared_supported
      USAGE_REPORTING: *user_declared_supported

  # --- 编辑（`scientific_editor`，`editorial` 相）---------------------------
  # 编辑读的是**评审者**的判词；与写作组同模型是**既有取舍**（GOAL-20261111-108：
  # 四个零价模型下写作组整体占一个）。它与评审 A/B 仍不同模型 ⇒
  # `validate_bundle` 的 writer ∩ reviewer = ∅ 仍成立。
  scientific_editor_model:
    endpoint: main
    display_name: Hy4 Flash Free (handling editor)
    model_name: hy4-flash-free  # 编辑
    context_window_tokens: 1048576
    capabilities:
      CHAT: *user_declared_supported
      STREAMING: *user_declared_supported
      USAGE_REPORTING: *user_declared_supported
