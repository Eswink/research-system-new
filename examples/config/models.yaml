models:
  agnes_flash:
    endpoint: main
    display_name: DeepSeek V4 Flash Vision
    model_name: deepseek-v4-flash-vision
    # 声明值（由登记方声明、非探测）：本版本不发送给 provider，也不参与 eligibility 判定
    # 读数来源：`GET /v1/models` 的 `max_context_length`（2026-10-14 实查 = 1048576）。
    context_window_tokens: 1048576
    thinking_intensity: MAX
    capabilities:
      CHAT: &user_declared_supported
        status: SUPPORTED
        confidence: 0.5
        source: USER_DECLARED
        last_verified_at: null
        probe_version: null
      STREAMING: *user_declared_supported
      TOOL_CALLING_NATIVE: *user_declared_supported
      STRUCTURED_OUTPUT_NATIVE: *user_declared_supported
      USAGE_REPORTING: *user_declared_supported

  research_alpha:
    endpoint: main
    display_name: Research Alpha
    model_name: deepseek-v4-flash-vision
    capabilities:
      CHAT: *user_declared_supported
      STREAMING: *user_declared_supported
      TOOL_CALLING_NATIVE: *user_declared_supported
      STRUCTURED_OUTPUT_NATIVE: *user_declared_supported
      USAGE_REPORTING: *user_declared_supported

  coding_beta:
    endpoint: main
    display_name: Coding Beta
    model_name: deepseek-v4-flash-vision
    capabilities:
      CHAT: *user_declared_supported
      STREAMING: *user_declared_supported
      TOOL_CALLING_NATIVE: *user_declared_supported
      STRUCTURED_OUTPUT_NATIVE: *user_declared_supported

  reviewer_gamma:
    endpoint: main
    display_name: Reviewer Gamma
    model_name: deepseek-v4-flash-vision
    capabilities:
      CHAT: *user_declared_supported
      STREAMING: *user_declared_supported
      STRUCTURED_OUTPUT_PROMPTED: *user_declared_supported
      TOOL_CALLING_NATIVE: *user_declared_supported
