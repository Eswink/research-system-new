models:
  agnes_flash:
    endpoint: main
    display_name: DeepSeek V4 Flash Vision
    model_name: deepseek-v4-flash-vision
    # 声明值（由登记方声明、非探测）：本版本不发送给 provider，也不参与 eligibility 判定
    # 读数来源：`GET /v1/models` 的 `max_context_length`（2026-10-14 实查 = 1048576）。
    context_window_tokens: 1048576
    thinking_intensity: MAX
    capabilities:
      CHAT: &user_declared_supported
        status: SUPPORTED
        confidence: 0.5
        source: USER_DECLARED
        last_verified_at: null
        probe_version: null
      STREAMING: *user_declared_supported
      TOOL_CALLING_NATIVE: *user_declared_supported
      STRUCTURED_OUTPUT_NATIVE: *user_declared_supported
      USAGE_REPORTING: *user_declared_supported

  research_alpha:
    endpoint: main
    display_name: Research Alpha
    model_name: deepseek-v4-flash-vision
    capabilities:
      CHAT: *user_declared_supported
      STREAMING: *user_declared_supported
      TOOL_CALLING_NATIVE: *user_declared_supported
      STRUCTURED_OUTPUT_NATIVE: *user_declared_supported
      USAGE_REPORTING: *user_declared_supported

  coding_beta:
    endpoint: main
    display_name: Coding Beta
    model_name: deepseek-v4-flash-vision
    capabilities:
      CHAT: *user_declared_supported
      STREAMING: *user_declared_supported
      TOOL_CALLING_NATIVE: *user_declared_supported
      STRUCTURED_OUTPUT_NATIVE: *user_declared_supported

  reviewer_gamma:
    endpoint: main
    display_name: Reviewer Gamma
    model_name: deepseek-v4-flash-vision
    capabilities:
      CHAT: *user_declared_supported
      STREAMING: *user_declared_supported
      STRUCTURED_OUTPUT_PROMPTED: *user_declared_supported
      TOOL_CALLING_NATIVE: *user_declared_supported

  # 第三方评审模型（GOAL-20261018-084 EC-01/EC-02）：**底层 model_name 与生产者不同**
  # （`deepseek-v4-flash-vision` vs `glm-5.3`），这是「评审独立于生产者」可判的前提。
  # 读数来源（2026-10-18 实查，同一 `main` 端点 + `LLM_MAIN_KEY`）：
  #   - `GET /v1/models` 回报该 id `is_ready: true`、`max_context_length = 1048576`；
  #   - `POST /v1/chat/completions` ⇒ HTTP 200、`content: "OK"`、**返回名 = 声明名** `glm-5.3`
  #     （与主模型的 `deepseek-v4-flash-vision` → `dsv4-flash-vision` 不同，仍属 §4
  #     「可重复配置」而非「完全模型可复现」）；
  #   - `tool_choice: required` ⇒ 真返回标准 `tool_calls`（`TOOL_CALLING_NATIVE`）；
  #   - `stream: true` ⇒ SSE chunk（`STREAMING`）；`usage` 逐次回报（`USAGE_REPORTING`）。
  #   - **`STRUCTURED_OUTPUT_NATIVE` 不声明**：provider 的 `/v1/models` 把
  #     `structured_outputs` 声称支持，但实跑 `response_format: json_schema` 时**多出 schema
  #     之外的键且把 string 写成 number** ⇒ 实测未强制 ⇒ 声明为 `PROMPTED`（按实测，不按声称）。
  reviewer_independent:
    endpoint: main
    display_name: Reviewer Independent (GLM-5.3, third-party reviewer)
    model_name: glm-5.3
    context_window_tokens: 1048576
    capabilities:
      CHAT: *user_declared_supported
      STREAMING: *user_declared_supported
      TOOL_CALLING_NATIVE: *user_declared_supported
      STRUCTURED_OUTPUT_PROMPTED: *user_declared_supported
      USAGE_REPORTING: *user_declared_supported

  # 第二个第三方评审模型（`max_instances: 2` 的评审 panel 的第二个成员）。
  # 读数来源（2026-10-18 实查，同一 `main` 端点 + `LLM_MAIN_KEY`）：
  #   - `GET /v1/models` ⇒ `is_ready: true`、`max_context_length = 262144`；
  #   - `POST /v1/chat/completions` ⇒ HTTP 200、`content: "OK"`、**返回名 = 声明名**；
  #   - `tool_choice: required` ⇒ 真返回标准 `tool_calls`；`stream: true` ⇒ SSE chunk；
  #     `usage` 逐次回报；
  #   - `response_format: json_schema` 实测**被遵守**（只回 schema 内的键、类型正确）
  #     ⇒ 这里是唯一声明 `STRUCTURED_OUTPUT_NATIVE` 的第三方模型（按**实测**，不按声称）。
  kimi_k2_6:
    endpoint: main
    display_name: Kimi K2.6 (third-party reviewer, second panel member)
    model_name: kimi-k2.6
    context_window_tokens: 262144
    capabilities:
      CHAT: *user_declared_supported
      STREAMING: *user_declared_supported
      TOOL_CALLING_NATIVE: *user_declared_supported
      STRUCTURED_OUTPUT_NATIVE: *user_declared_supported
      USAGE_REPORTING: *user_declared_supported

  # 第三个第三方评审模型（GOAL-20261026-097 EC-04(b)）：`novelty_reviewer` 的评审者。
  # **为什么必须再要一个**：`check_heterogeneity` 只判「writer ∪ reviewer 的目标集不相交」，
  # 而**不**判「两位评审者彼此不同」⇒ 若新 agent 复用一个已有评审模型，判据会绿，但
  # 「两个独立的评审面」这件事就只剩一个模型说了算（`panel_verdict.independent` 在运行期
  # 才看得见）。本轮的取舍：用**第三个**底层模型，让独立性在**目录声明**上就成立。
  #
  # 读数来源（2026-10-26 实查，同一 `main` 端点 + `LLM_MAIN_KEY`）：
  #   - `GET /v1/models` ⇒ `is_ready: true`（13 个可用模型之一）；
  #   - `POST /v1/chat/completions`（`max_tokens=512`）⇒ HTTP 200、`content: "OK"`、
  #     **返回名 = 声明名** `minimax-m3`（与 `deepseek-v4-flash-vision` → `dsv4-flash-vision`
  #     的改名形态不同；仍属 §4「可重复配置」而非「完全模型可复现」）；
  #   - `tool_choice: required` ⇒ 真返回标准 `tool_calls`（`TOOL_CALLING_NATIVE`）；
  #   - **不**声明 `STRUCTURED_OUTPUT_NATIVE`：本轮只实测了 chat 与 tool_calls，
  #     「按实测声明」是本仓的既有纪律（`reviewer_independent` 的注释同一条）。
  novelty_review_model:
    endpoint: main
    display_name: MiniMax M3 (third-party novelty reviewer)
    model_name: minimax-m3
    context_window_tokens: 1048576
    capabilities:
      CHAT: *user_declared_supported
      STREAMING: *user_declared_supported
      TOOL_CALLING_NATIVE: *user_declared_supported
      USAGE_REPORTING: *user_declared_supported

  # 第四个第三方模型（GOAL-20261027-098 EC-01）：`novelty_author` 的**绑定 agent**。
  # **为什么必须再要一个**：拆开「创新点的作者」与「评审者」之后，作者**不得**落在
  # 任何评审者或生产侧的执行目标上，否则「独立评审」在声明面上就不成立 ——
  # `check_heterogeneity`（writer∪reviewer）与 `validate_bundle.py` 的
  # writer/reviewer 集合不交两条判据都会判负。
  #
  # 读数来源（2026-10-27 实查，同一 `main` 端点 + `LLM_MAIN_KEY`）：
  #   - `GET /v1/models` ⇒ 在 13 个可用模型之列（`is_ready` 由该接口的判定给出）；
  #   - `POST /v1/chat/completions`（`max_tokens=64`）⇒ HTTP 200、`content: "OK"`、
  #     **返回名 = 声明名** `deepseek-v4-pro-0813`（与主模型的
  #     `deepseek-v4-flash-vision` → `dsv4-flash-vision` 的改名形态不同；仍属 §4
  #     「可重复配置」而非「完全模型可复现」）；
  #   - `tool_choice: required` ⇒ 真返回标准 `tool_calls`（`TOOL_CALLING_NATIVE`）；
  #     `usage` 逐次回报。
  #   - **不**声明 `STRUCTURED_OUTPUT_NATIVE`：本轮只实测了 chat 与 tool_calls，
  #     「按实测声明」是本仓的既有纪律（`novelty_review_model` 的注释同一条）。
  novelty_author_model:
    endpoint: main
    display_name: DeepSeek V4 Pro 0813 (novelty author)
    model_name: deepseek-v4-pro-0813
    context_window_tokens: 1048576
    capabilities:
      CHAT: *user_declared_supported
      STREAMING: *user_declared_supported
      TOOL_CALLING_NATIVE: *user_declared_supported
      USAGE_REPORTING: *user_declared_supported

  # 第五个第三方模型（GOAL-20261029-100 EC-02）：`scientific_editor` 的**绑定 agent**。
  # **为什么必须再要一个**：编辑处置的是**评审者**给出的意见 ⇒ 与评审者同模型的话，
  # 「编辑对评审的处置」只是同一个模型自言自语。既有五个 `model_name` 各占一角
  # （`deepseek-v4-flash-vision` / `glm-5.3` / `kimi-k2.6` / `minimax-m3` /
  # `deepseek-v4-pro-0813`），本模型是第六个。
  #
  # 读数来源（2026-10-29 实查，同一 `main` 端点 + `LLM_MAIN_KEY`）：
  #   - `GET /v1/models` ⇒ `is_ready: true`（13 个可用模型之一）；
  #   - `POST /v1/chat/completions` ⇒ HTTP 200、**返回名 = 声明名** `qwen3.8-27b`
  #     （与主模型的 `deepseek-v4-flash-vision` → `dsv4-flash-vision` 的改名形态不同；
  #     仍属 §4「可重复配置」而非「完全模型可复现」）；
  #   - `max_tokens=32` ⇒ `content: None`、`completion_tokens_details.reasoning_tokens=32`
  #     （该模型先花 token 在推理上）；`max_tokens=400` ⇒ `content: "\n\nOK"`。
  #     **这是实测行为**，不是故障：额度给小了拿不到正文。
  #   - **不**声明 `TOOL_CALLING_NATIVE` / `STRUCTURED_OUTPUT_NATIVE`：本轮只实测了
  #     chat 与 usage，「按实测声明」是本仓既有纪律（`novelty_author_model` 同一条）。
  scientific_editor_model:
    endpoint: main
    display_name: Qwen3.8 27B (handling editor)
    model_name: qwen3.8-27b
    context_window_tokens: 1048576
    capabilities:
      CHAT: *user_declared_supported
      STREAMING: *user_declared_supported
      USAGE_REPORTING: *user_declared_supported
