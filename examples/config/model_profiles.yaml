model_profiles:
  # GOAL-20261111-108：**fallback 不得落到评审者的目标上**。
  # 原先 `research_strong.fallback = [reviewer_gamma]`，而 `reviewer_gamma` 当时与生产者
  # 同款模型（`deepseek-v4-flash-vision`）⇒ 回落无害。换站之后 `reviewer_gamma` 承载的是
  # **评审 A** 的模型（`hy4-preview-f`）⇒ 同一条 fallback 变成「写作可以回落到评审 A 的
  # 目标」，独立性被悄悄破坏。判据抓到了它（`test_the_factory_reviewer_and_producer_sit_
  # on_different_underlying_models` 的「生产与评审 A 同目标」）。
  # 修法与 `critic_independent` 同一条纪律：**回落到同侧**（写作 → 另一个写作面模型）。
  research_strong:
    primary: research_alpha
    fallback:
      - coding_beta

  research_fast:
    primary: coding_beta
    fallback:
      - research_alpha

  coding_strong:
    primary: coding_beta
    hard_capabilities:
      - CHAT
      - TOOL_CALLING_NATIVE

  # 独立评审 profile（GOAL-20261018-084）：primary 是**底层 model_name 与生产者不同**的
  # 第三方模型；**fallback 刻意留空** —— 原先它回落到 `research_alpha`（= 生产者模型），
  # 那正是本轮要消灭的形态：一个名字叫「独立」的 profile 却能落到生产者的同一个模型上。
  critic_independent:
    primary: reviewer_independent
