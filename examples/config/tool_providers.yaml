tool_providers:
  openhands_workspace:
    kind: NATIVE
    trust_level: BUILT_IN
    capabilities:
      - workspace.read
      - workspace.write.notes
      - workspace.write.code
      - code.execute
      - git.diff
    effect_class: EXECUTE

  m12_artifact:
    kind: NATIVE
    trust_level: BUILT_IN
    capabilities:
      - artifact.read
      - artifact.write
      - evidence.read
      - evidence.write
    effect_class: READ_ONLY

  ncbi_eutils:
    kind: REST
    trust_level: VERIFIED
    transport: rest
    # 端点来源声明（可选）：环境变量名，其值是端点 URL。
    # 这里**不声明** —— 适配器自带 E-utilities 默认端点；声明了却未设置环境变量
    # 会被判为不可用（诚实 UNKNOWN）。凭据（NCBI_API_KEY）不写在这里：
    # 凭据只经 CredentialResolver 按 credential_ref 解析。
    protocol_version: eutils-2026-08-22
    capabilities:
      - literature.search
      - literature.read
      - citation.inspect
    effect_class: READ_ONLY
    network_domains:
      - eutils.ncbi.nlm.nih.gov
    health_check: true
