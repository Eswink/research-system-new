tool_providers:
  research_mcp:
    kind: MCP
    trust_level: USER_APPROVED
    transport: streamable_http
    endpoint_env: RESEARCH_MCP_URL
    protocol_version: auto_negotiate
    capabilities:
      - literature.search
      - literature.read
      - citation.inspect
    effect_class: READ_ONLY
    network_domains:
      - research-tools.example.com
    health_check: true

  openhands_workspace:
    kind: NATIVE
    trust_level: BUILT_IN
    capabilities:
      - workspace.read
      - workspace.write.notes
      - workspace.write.code
      - code.execute
      - git.diff
    effect_class: EXECUTE

  m12_artifact:
    kind: NATIVE
    trust_level: BUILT_IN
    capabilities:
      - artifact.read
      - artifact.write
      - evidence.read
      - evidence.write
    effect_class: READ_ONLY

  ncbi_eutils:
    kind: REST
    trust_level: VERIFIED
    transport: rest
    endpoint_env: NCBI_API_KEY
    protocol_version: eutils-2026-08-22
    capabilities:
      - literature.search
      - literature.read
      - citation.inspect
    effect_class: READ_ONLY
    network_domains:
      - eutils.ncbi.nlm.nih.gov
    health_check: true
