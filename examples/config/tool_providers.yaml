tool_providers:
  openhands_workspace:
    kind: NATIVE
    trust_level: BUILT_IN
    capabilities:
      - workspace.read
      - workspace.write.notes
      - workspace.write.code
      - code.execute
      - git.diff
    effect_class: EXECUTE

  m12_artifact:
    kind: NATIVE
    trust_level: BUILT_IN
    capabilities:
      - artifact.read
      - artifact.write
      - evidence.read
      - evidence.write
      # GOAL-029 EC-01：A 组零依赖读能力的**承接**（声明 + 实现在
      # `adapters/canonical/read_provider.py`）。这几条读的全部是 canonical state
      # （ArtifactStore / EvidenceLedger / BudgetLedger），零新增外部依赖、零凭据。
      # **承接 ≠ 放行**：执行仍由 `policy.yaml` 裁决 —— 未放行的能力点名
      # `POLICY_DENIED`（见 `tests/architecture/python/test_capability_coverage_...`）。
      #
      # **声明必须伴实现**（收口审计教训）：本清单里的每一条都在
      # `adapters/canonical/read_provider.py` 有真实现；曾经声明过而无实现的条目
      # （`experiment.read` / `experiment_plan.read` 的**第一版**）已被移除过一次 ——
      # 后来又**补上了实现**（ExperimentStore 接进 provider 依赖面）才重新声明。
      - claim.read
      - budget.read
      - deliverable.read
      - experiment.read
      - experiment_plan.read
      # GOAL-20261005-030 EC-02：`run.read` 的承接 —— 读 `RunStore`（既有 Port，
      # 两个组合根都持有实例），与 HTTP 读面 `GET /runs/{id}` 同一个 `get_run`。
      # 实现在 `adapters/canonical/run_read.py`（`read_provider.py` 恰守 450 行上限）。
      # **承接 ≠ 放行**：无 `allow` ⇒ 调用点名 `POLICY_DENIED`。
      - run.read
      # GOAL-20261008-036 EC-02：`review.read` 的承接 —— 读 GOAL-035 EC-01 的 canonical
      # 评审结论记录（`ReviewFindingStore.for_run`，与读面 `GET /runs/{id}/reviews` 同口径）。
      # 实现在 `adapters/canonical/review_read.py`（同一条 450 行理由）。
      - review.read
      # GOAL-20261008-037 EC-03：`research_state.read` 的承接 —— 读**程序内前序 run**
      # 的落库结论（入口是程序归属：`RunStore.for_program` + `ReviewFindingStore.for_run`）。
      # 实现在 `adapters/canonical/research_state_read.py`（同一条 450 行理由）。
      - research_state.read
    effect_class: READ_ONLY

  ncbi_eutils:
    kind: REST
    trust_level: VERIFIED
    transport: rest
    # 两个"声明即承诺"的字段都在这里**不声明**，理由各不相同：
    # - endpoint_env（端点来源）：适配器自带 E-utilities 默认端点；声明了却未设置
    #   环境变量会被判为不可用（诚实 UNKNOWN）。
    # - credential_ref（**必需**凭据）：NCBI_API_KEY 是**可选**的——无 key 也能用，
    #   只是限速更严（3 req/s vs 10 req/s，适配器按 min_request_interval_seconds
    #   强制间隔）。声明即"没有它不可用"，因此可选凭据不写在这里；适配器自己按
    #   `NcbiEutilsProvider(credential_ref=...)` 的构造参数在调用点解析。
    protocol_version: eutils-2026-08-22
    capabilities:
      - literature.search
      - literature.read
      - citation.inspect
    effect_class: READ_ONLY
    network_domains:
      - eutils.ncbi.nlm.nih.gov
    health_check: true

  # GOAL-20261006-031 EC-02（授权 2）：`citation.validate` 的承接面。
  # **为什么另立一条 provider 而不是扩 `ncbi_eutils`**（路线 F，建档实测的判红面）：
  # 扩既有 provider 会改它的工具名集合与能力列表，而那是 `test_ncbi_provider_contract` /
  # `test_contract_loaders` 逐字钉死的既有事实（改它 = 改既有判据断言 ⇒ 命中全局禁令）。
  # 另立一条把影响面限制在本新增条目内：既有 `ncbi_eutils` 的工具面与能力列表**逐字不变**。
  # **同一个上游域与同一份取数实现**：端点、限速、凭据解析、错误映射与 `ncbi_eutils` 同源
  # （适配器侧是子类复用同一个 elink 取数点，不是第二套 HTTP 客户端）。
  ncbi_citation:
    kind: REST
    trust_level: VERIFIED
    transport: rest
    protocol_version: eutils-2026-08-22
    capabilities:
      - citation.validate
    effect_class: READ_ONLY
    network_domains:
      - eutils.ncbi.nlm.nih.gov
    health_check: true

  # GOAL-20260927-027 EC-01：第二个真实文献源（Europe PMC REST）。
  # 与 `ncbi_eutils` 的三点差别，逐条写明理由：
  # - **无凭据**：Europe PMC 的 search / 按 id 取记录都是公开端点，匿名可用 ⇒ 不声明
  #   `credential_ref`（声明即「没有它不可用」，而它不是）；适配器也不解析任何凭据，
  #   因此不存在把别域令牌转发出去的通道。
  # - **无 `endpoint_env`**：适配器自带 Europe PMC 默认端点（同 `ncbi_eutils` 的理由）。
  # - **能力名复用** `literature.search` / `literature.read`：能力词表不动
  #   （`_CAPABILITY_SCOPE` 镜像与 `policy.yaml` 由既有判据锁死并集，本轮零改动）。
  # `network_domains` 是**运行时出口白名单的权威声明**：适配器在**触网之前**要求
  # 目标 host 落在本列表内（复用全仓唯一保留类判据 `endpoint_url_refusal`，
  # 不新造第二个 host 谓词）。
  europe_pmc:
    kind: REST
    trust_level: VERIFIED
    transport: rest
    protocol_version: europepmc-rest-6.9
    capabilities:
      - literature.search
      - literature.read
    effect_class: READ_ONLY
    network_domains:
      - www.ebi.ac.uk
    health_check: true

  # 参考形态（未启用）：需要凭据才能工作的 provider 才写 credential_ref。
  # MCP streamable_http 就是这种——适配器构造期即要求 credential_ref，
  # 只是那条要求此前进不了 spec（注册面/读面看不见）。取消注释即生效：
  # 凭据不在时健康探测如实 UNKNOWN 并点名引用，不伪装可用。
  # docs_mcp:
  #   kind: MCP
  #   trust_level: USER_APPROVED
  #   transport: streamable_http
  #   capabilities:
  #     - docs.search
  #   effect_class: READ_ONLY
  #   network_domains:
  #     - docs.internal.example
  #   credential_ref: DOCS_MCP_TOKEN
  #   health_check: true
