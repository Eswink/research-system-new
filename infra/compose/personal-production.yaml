# PA-1 personal production profile: self-contained stack for one user.
#
# 与 infra/compose/postgres-test.yaml 的区别：postgres-test 的 postgres 数据目录是
# tmpfs（CI/开发按设计即用完即弃）；个人生产基线必须持久化。本文件单独提供
# postgres + otel-collector；API / gateway / worker / console 按
# docs/operations/PERSONAL_DEPLOYMENT.md 用 uv / pnpm 在本机启动。
#
# 密码不写在文件里：从仓库根 gitignored 的 .env 取
# RESEARCHOS_POSTGRES_PASSWORD（--project-directory . 让 compose 以仓库根解析 .env）。
# 启动(仓库根): docker compose --project-directory . -f infra/compose/personal-production.yaml up -d --build
# 停止: docker compose --project-directory . -f infra/compose/personal-production.yaml down   (保留卷)
# 清库: docker compose --project-directory . -f infra/compose/personal-production.yaml down -v (删除卷)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: research_os
      POSTGRES_USER: research_os
      POSTGRES_PASSWORD: ${RESEARCHOS_POSTGRES_PASSWORD:?set in .env}
    ports:
      # Personal production is host-local by default.  Do not expose the
      # canonical database on LAN/public interfaces just because Docker
      # publishes a host port for API/Gateway access.
      - "127.0.0.1:${RESEARCHOS_POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      # 命名卷而非 bind mount：数据在 Docker Desktop 内部卷中，避免 WSL2
      # bind-mount 损坏风险（D: 挂载损坏需重启 Desktop 的历史教训）。
      - research_os_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research_os -d research_os"]
      interval: 2s
      timeout: 2s
      retries: 30

  # 证据目录供给：fresh clone / 新主机上 `data/otel` 不存在，Docker 会以 root:root
  # 创建 bind mount 源目录，而 collector 以 uid 10001 运行 ⇒ file exporter
  # permission denied、证据文件永不落盘（且落盘文件默认 0600，宿主侧读不到）。
  # 一次性初始化对齐属主/模式；init 镜像复用本栈已依赖的 postgres:16-alpine。
  evidence-dir:
    image: postgres:16-alpine
    user: "0:0"
    command:
      - sh
      - -c
      - >-
        mkdir -p /var/lib/otelcol &&
        touch /var/lib/otelcol/research_os_signals.json &&
        chown -R 10001:10001 /var/lib/otelcol &&
        chmod 0644 /var/lib/otelcol/research_os_signals.json
    restart: "no"
    volumes:
      - ./data/otel:/var/lib/otelcol

  otel-collector:
    build:
      context: ./adapters/otel/collector
    image: research-os/otel-collector:0.139.0
    depends_on:
      evidence-dir:
        condition: service_completed_successfully
    ports:
      # loopback-only: the collector receiver has no auth extension and no TLS,
      # and every accepted signal is written verbatim to the evidence file sink.
      # Publishing on all interfaces would let anyone on the host network post
      # arbitrary OTLP into the evidence pipeline (M15 re-audit control).
      - "127.0.0.1:${RESEARCHOS_OTEL_HOST_PORT:-4318}:4318"
    volumes:
      - ./data/otel:/var/lib/otelcol
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config", "/etc/otelcol-contrib/config.yaml"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  research_os_pgdata:
