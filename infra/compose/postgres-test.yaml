services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: research_os
      POSTGRES_USER: research_os
      POSTGRES_PASSWORD: research_os_m14_test
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research_os -d research_os"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
