# M15 telemetry 证据管线(与 infra/compose/postgres-test.yaml 的 postgres 服务可叠加)。
# 启动(仓库根): docker compose --project-directory . -f infra/compose/postgres-test.yaml -f infra/compose/otel-evidence.yaml up -d
services:
  otel-collector:
    build:
      context: ./adapters/otel/collector
    image: research-os/otel-collector:0.139.0
    ports:
      # loopback-only: the collector receiver has no auth extension and no TLS,
      # and every accepted signal is written verbatim to the evidence file sink.
      # Publishing on all interfaces would let anyone on the host network post
      # arbitrary OTLP into the evidence pipeline (M15 re-audit finding; the
      # declared control in UPSTREAM_COMPONENTS.yaml is loopback-only).
      - "127.0.0.1:4318:4318"
    volumes:
      - ./data/otel:/var/lib/otelcol
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config", "/etc/otelcol-contrib/config.yaml"]
      interval: 5s
      timeout: 3s
      retries: 12
