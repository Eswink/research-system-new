problem:
  observed_behavior: "MCP 工具调用（cursor-ide-browser / cursor-app-control 两个服务）被仓库安全门禁 hook 以 fail-closed 方式全部拒绝，报错 '安全门禁缺少有效的 tool_name/tool_input 字段'；调用参数已按工具 JSON schema 核对仍被拒，证明拦截与参数内容无关；系统 sessionStart 提示该签名已跨 ≥2 次会话出现。"
  expected_behavior: "agent 遇到该拦截时：不重试同一调用（同签名必败）、不修改/绕过 hook（fail-closed 是既定安全语义），先用替代工具完成同一意图；hook 属仓库代码，根因定位后可在仓库内修复（无需用户改 Settings），修复后 MCP 恢复 ask 确认流程。"
  reproduction: "修复前调用任意 MCP 工具即复现（browser_tabs、rename_chat 已实测 2 次）；失败后改用 WebSearch/WebFetch/Read/Grep/Ls/Shell 替代路径全部成功；修复后 browser_tabs 调用成功返回。"
hypothesis:
  root_cause: "mcp_guard.py 对 beforeMCPExecution 事件的参数解析 bug：Cursor 3.16.29 实测参数字段为 tool_input 且值是 JSON 字符串（官方文档称 arguments，字段名不一致），原代码要求 tool_input 为 dict 且不识别 arguments → 所有 MCP 调用 fail-closed 拒绝。已用临时 dump hook 捕获真实 payload 确证，并修复（_parse_tool_input 兼容两字段名 × 两种形态）。confidence 0.7：dump 实测 + 源码核对 + 修复后回归 + 真实环境验证。"
