summary: "Windows PowerShell 下禁止在 Shell 命令中内嵌多层引号（管道 + 长正则、python -c 嵌套、内联 JSON）：命令被 ps-script 双重解析报 ParserError；模式扫描优先 Grep 工具，探测代码落脚本文件"
severity: NORMAL
category: reliability
