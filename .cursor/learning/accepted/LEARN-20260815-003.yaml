  - task_ref: "M9 会话（2026-08-15）"
    evidence_ref: "uv run python -B -c 内嵌多层引号冒烟脚本报 ParserError（参数列表中缺少参量）；git diff --cached | rg -n 长正则含引号报 ParserError（ps-script 双重解析）"
  - task_ref: "M10 独立复审会话（2026-08-15）"
    evidence_ref: "git diff --cached | rg 多模式 secret 正则报 ParserError（ps-script 包装脚本中 FromBase64String/Set-Alias 注入行语法错误）；改用 Grep 工具按目录+pattern 匹配成功（4 处命中）"
problem:
  observed_behavior: "在 Windows PowerShell 会话中执行任何含嵌套引号的 Shell 命令（管道 grep/rg + 长正则、python -c 内多层引号、内联 JSON）时报 ParserError，报错位置指向临时 ps-script 包装脚本的编码/别名注入行（如 FromBase64String、Set-Alias），而非用户命令本身；命令未执行、无任何业务输出。M9 会话 2 次、M10 会话 1 次独立复现。"
  expected_behavior: "引号嵌套类命令不经 PowerShell 解析路径执行：模式扫描用 Grep 工具（ripgrep，path+pattern 参数化）或简化正则；探测/冒烟代码写入临时脚本文件执行；命令执行成功且输出正常。"
  reproduction: "Windows PowerShell + Cursor Shell 工具下，直写 `git diff --cached | rg -n \"<多模式正则>\"` 或 `python -c \"...\\\"...\\\"...\"` 即复现（M9/M10 两个会话独立发生）；改用 Grep 工具或脚本文件后同一意图的任务成功完成。"
hypothesis:
  root_cause: "Cursor Shell 工具在 Windows PowerShell 下把 command 包装进临时 ps-script（含 base64 解码与 Set-Alias 注入），用户命令中的嵌套引号破坏了包装脚本语法，导致整条命令被解析器拒绝。权威依据：跨会话 3 次失败 + 每次失败后的成功路径对照（简化正则/Grep 工具/脚本文件）；同族核心签名已晋升 LEARN-20260813-001。"
  confidence: 0.6
proposal:
  target_type: RULE
  target_paths:
    - ".cursor/rules/42-command-encoding.mdc"
  change_summary: "在既有 PowerShell 命令约束（; 分隔、git commit -F、cmd /c 包裹）上补充：任何含嵌套引号的命令（管道 + 长正则、多层 -c、内联 JSON）不得直写 Shell command；对变更文件的模式扫描优先用 Grep 工具（path + pattern 参数）；探测代码落临时脚本文件后经 uv run 执行。"
  blast_radius: "仅 .cursor/rules 文档约束扩展；无代码/配置行为变化；governance validator 覆盖。"
replay:
  before_cases:
    - "M9 会话：uv run python -B -c 内嵌多层引号 → ParserError（参数列表中缺少参量）"
    - "M9 会话：git diff --cached | rg -n 长正则含引号 → ParserError"
    - "M10 会话：git diff --cached | rg 多模式 secret 正则 → ParserError（ps-script 注入行语法错误）"
  before_result: "FAIL（3/3 复现，跨 M9/M10 两个会话）"
  after_cases:
    - "M9 会话：探测代码写入临时脚本 .m9-smoke.py 经 uv run 执行 → 成功"
    - "M9 会话：secret 扫描正则简化后重跑 → 成功"
    - "M10 会话：改用 Grep 工具（path=变更目录 + pattern 参数）→ 4 处测试 fixture 命中，无 ParserError"
  after_result: "PASS（3/3 成功，2026-08-15 实测）"
