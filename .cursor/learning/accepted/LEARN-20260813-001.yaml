problem:
  observed_behavior: "PowerShell 下 bash 风格命令串联报 ParserError（标记“&&”不是此版本中的有效语句分隔符）；heredoc 与 cmd /x 开关同样解析失败（dir /b 被当作路径 D:\\b）。"
  expected_behavior: "多命令按当前 shell 语法执行：PowerShell 用 ; 分隔；长 commit message 用 -F 文件；cmd 开关用 cmd /c 包裹。"
  reproduction: "任意 PowerShell 5.x 终端执行 `Write-Output a && Write-Output b` 即复现；跨会话累计 5 次（2026-08-12 x4、2026-08-13 x1）。"
hypothesis:
  root_cause: "PowerShell 不兼容 bash 的 && / heredoc / cmd /x 语法；开发者按 POSIX 习惯写命令。权威依据：PowerShell 语法规范（T1 级）+ 本地 5 次独立复现。"
  confidence: 0.8
proposal:
  target_type: RULE
  target_paths:
    - ".cursor/rules/42-command-encoding.mdc"
  change_summary: "在既有“确认 shell 支持才使用 &&”约束下补充 PowerShell 具体写法清单：`;` 分隔替代 `&&`/`||` 串联、`git commit -F <file>` 替代 heredoc 内嵌多行、cmd 开关用 `cmd /c \"...\"` 包裹（`dir /b` 会被解析为路径）；保留 POSIX 示例对照。"
  blast_radius: "仅 .cursor/rules 文档约束；无代码/配置行为变化；governance validator 覆盖。"
replay:
  before_cases:
    - "Write-Output \"a\" && Write-Output \"b\"（PowerShell 5.x）→ ParserError"
    - "git log --oneline -15 && git status --short（M6 复审会话）→ ParserError"
    - "dir /b <path>（PowerShell）→ 找不到路径 D:\\b"
  before_result: "FAIL（3/3 复现）"
  after_cases:
    - "Write-Output \"a\"; Write-Output \"b\" → a b 顺序输出（2026-08-13 实测）"
    - "git status --short; git log --oneline -3 → 正常（2026-08-13 实测）"
    - "cmd /c \"dir /b <path>\" → 正常列举（M5R 会话实证）"
  after_result: "PASS（3/3 成功）"
