  reproduction: "对含 `.env` 路径的任意 Shell 命令（git check-ignore/status --porcelain 指定该文件、Get-ChildItem 过滤 .env*）执行即复现 fail-closed 拒绝；AwaitShell 传 float 参数即报类型错误。"
