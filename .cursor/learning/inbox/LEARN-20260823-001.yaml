problem:
  observed_behavior: "Read/Shell 工具在 Windows 仓库上偶发 CURSOR_ERROR，同一签名跨 2 个会话复现（Read d42fb89b03dfc2000b49、Shell f3eb42211d52fea83bd0）；本会话 84 次工具失败全部属于该家族。duration 极短（<2ms）或 0.6-1.6s，不表现为命令超时。另有 TOOL_FAILURE 空载荷哨兵（e3b0c442… = sha256(\"\") 前缀）在统计中冒充跨会话重复。"
  expected_behavior: "对 duration<10ms 的 CURSOR_ERROR 先重试一次，仍失败改替代路径（Shell Get-Content/Grep 限行、写临时脚本），不把瞬时失败当作命令失败进入诊断；失败签名统计必须先过滤 tool_name 为 null 的 TOOL_FAILURE 哨兵；跨会话判定以不同 observation 文件为准。"
  reproduction: "在 3 个会话中执行 Read/Shell 即复现同一/同族签名（内容相关 hash，单会话内几乎不重复）；重试一次或改替代路径后成功。"
hypothesis:
  root_cause: "hook（common.read_event_result / secret_guard）对 Read/Shell 载荷的文本扫描在中文/引号/BOM 边界偶发 fail-closed 瞬时拒绝（duration<10ms）；TOOL_FAILURE e3b0c442… 是记录层的空载荷哨兵事件（无工具上下文），不应计入可诊断失败。置信度 0.5（观察统计 + 跨会话复现，无 hook 源码级定位）。"
  confidence: 0.5
proposal:
