    - ".cursor/knowledge/KNOWN_CAVEATS.md"
  change_summary: "拟在 HOOKS_REFERENCE/KNOWN_CAVEATS 增补：CURSOR_ERROR 瞬时失败（duration<10ms）的处理路径（重试一次→替代工具），并注明 TOOL_FAILURE 空载荷哨兵（e3b0c442…）不计入失败统计；本 PROPOSED 阶段不改 Hook/Rule，等待第 3 个独立会话复现或确定性 before/after 证据。"
  blast_radius: "仅知识文档；不降低 failClosed，不改 Hook 行为。"
