problem:
  observed_behavior: "stop followup 报「本会话有 N 次工具失败」（原始行数，含空载荷哨兵与畸形行，且随会话推进漂移：本例报 3、最终 7）与「有 M 类失败签名已在 ≥2 次会话中出现」（实际判据是全语料总命中数 >= 2，无会话维度，且不与本会话签名求交）。本例 M=2 中 1 个是空载荷哨兵、且其 2 次命中同属单一会话文件。"
  expected_behavior: "失败计数应解析 JSON 并过滤 `tool_name is None` 哨兵；跨会话判据应按 distinct observation 文件数计；提示的签名类应与本会话签名求交后再建议 capture-learning；文案须与实际计算的属性一致（若判据是总命中数就不要写「会话」）。`_matching_experience` 应支持多签名条目（pipe 拼接）全量匹配。"
  reproduction: "确定性：读取 .cursor/runtime/observations/*.jsonl，按 tool_name is None 过滤后统计 distinct 文件数——得到唯一跨会话签名 784a8b47c701b4ee2656；不过滤则额外得到 e3b0c44298fc1c149afb（单文件 2 命中）。脚本 scratch/obs_signature_report.py 与 scratch/obs_signature_trace.py 可复现两种口径的差异。"
hypothesis:
  root_cause: "统计口径缺两个已在经验库确立的约束（哨兵过滤、按 observation 文件计跨会话），而 followup 文案按更强语义书写；FRONTMATTER_SIGNATURE_RE 的 `([0-9a-f]{20}|)` 单捕获组无法覆盖 pipe 拼接的多签名。置信度 0.6（源码逐行定位 + 两种口径实测差异双向确证；属确定性权威证据而非单次偶发观察）。"
  confidence: 0.6
