problem:
  observed_behavior: "Grep 的 `path` 或 Glob 的 `target_directory` 传入工作区根绝对路径（D:\\research-system 或 D:/research-system）时，确定性返回 `rg: : IO error for operation on : 系统找不到指定的路径。 (os error 3)` 并给出零结果。全语料 14 次命中、duration 40–116ms 全落在正常执行区间，无一次成功。"
  expected_behavior: "要么根路径被正常接受（等价于默认行为），要么返回可识别的参数错误。当前行为是静默零结果，可被误读为「仓库内无匹配」并据此得出错误结论——对架构边界扫描、调用点定位这类审计任务尤其危险。"
  reproduction: "确定性：对同一 pattern 发两次 Grep，一次带 `path=<工作区根绝对路径>`、一次省略 `path`。前者恒失败（os error 3），后者恒成功。传根之下的子路径（目录或单文件，如 D:/research-system/.cursor/hooks、D:/research-system/adapters/sqlite/eval_report_store.py）同样成功。"
hypothesis:
  root_cause: "错误文本中冒号之间的路径为空（`IO error for operation on :`），表明工具将传入路径相对化到工作区根后得到空字符串，并以空路径参数调用 rg；子路径相对化后非空故正常。旁证：省略 path 时结果前缀为 `.\\...`，传 .cursor/hooks 时前缀为 `.cursor/hooks/...`，两者均为相对根路径。置信度 0.6（14/14 确定性复现 + 错误文本空路径直证；未读工具实现源码）。"
  confidence: 0.6
proposal:
  target_type: RULE
  target_paths:
    - ".cursor/rules/42-command-encoding.mdc"
    - ".cursor/knowledge/KNOWN_CAVEATS.md"
  change_summary: "拟增补：Grep/Glob 检索全仓时省略 `path`/`target_directory`（默认即工作区根），需要限定范围时只传工作区根**之下**的子路径；传根路径本身会静默返回零结果。同时修订 42-command-encoding.mdc 中「Grep 工具（path + pattern 参数）」的表述，避免诱导传根路径。本 PROPOSED 阶段不改 Rule/Knowledge，等待显式授权与 before/after replay。"
  blast_radius: "仅规则/知识文档表述；不改变任何工具行为、不放宽任何门禁、不触碰 failClosed 语义。"
