cases:
  - id: experience-failure-prompted
    hook: distillation_gate.py
    input: {hook_event_name: stop, status: completed, loop_count: 0, conversation_id: eval-exp-1}
    seed:
      observations:
        - {at: "2026-08-12T00:00:00Z", tool_name: Shell, duration_ms: 10, is_interrupt: false, error_class: CURSOR_ERROR, error_signature: sig-a}
    expect_followup: true

  - id: experience-no-failure-silent
    hook: distillation_gate.py
    input: {hook_event_name: stop, status: completed, loop_count: 0, conversation_id: eval-exp-2}
    seed:
      observations: []
    expect_followup: false

