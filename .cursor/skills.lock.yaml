schema_version: 3
verified_at: "2026-08-11"
policy:
  mode: SOURCE_PIN_ONLY
  digest_scheme: PATH_AND_CONTENT_SHA256_V1
  digest_canonicalization: >-
    Sort UTF-8 relative paths; for each file hash raw bytes with SHA-256, then hash
    the UTF-8 sequence path + NUL + file_digest + LF.
  upgrade_gate:
    explicit_user_approval: true
    required_checks:
      - immutable_revision_resolution
      - content_digest_verification
      - license_review
      - content_diff_review
      - capability_permission_network_credential_diff
      - cursor_compatibility_validation
  rationale: >-
    The repository must be portable. External user-level skills are optional
    capabilities and are not assumed to exist under a developer home directory.
skills:
  - name: impeccable
    availability: OPTIONAL
    required_for:
      - frontend_design
      - frontend_ux_review
      - frontend_visual_quality
    source:
      repository: "https://github.com/pbakaus/impeccable"
      tag: "skill-v4.0.4"
      path: ".agents/skills/impeccable"
      revision: "9a949fb543d44cfb406f61bcab99d95d7f12cf1d"
      license: "Apache-2.0"
      license_evidence: "https://raw.githubusercontent.com/pbakaus/impeccable/9a949fb543d44cfb406f61bcab99d95d7f12cf1d/LICENSE"
    content:
      digest_algorithm: sha256
      digest_scheme: PATH_AND_CONTENT_SHA256_V1
      digest: "e2f1aecf1608ef4c6c258690850ad0e680d20746fc4aafe8c18017757d1ac399"
      file_count: 152
      verified_at: "2026-08-11"
    upgrade_gate:
      explicit_user_approval: true
      required_checks: inherit_policy
    resolution: >-
      If a UI task explicitly needs this skill, the active Cursor environment
      must expose the pinned content or the task proceeds with repository-native
      guidance only. Never silently trust an unverified home-directory install.

