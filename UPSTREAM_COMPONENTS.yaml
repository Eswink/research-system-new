schema_version: 2
audit_date: "2026-08-11"
project_version_source: VERSION
policy:
  adopted_requires:
    - immutable_resolution
    - sha256_integrity
    - spdx_license
    - license_evidence
    - upgrade_gate
  planned_must_not_claim_resolution: true

components:
  - id: pyyaml
    adoption_status: ADOPTED
    decision_status: APPROVED
    integration_mode: BUILD_TOOLING
    role: cursor_validator_yaml_parser
    source:
      kind: PYPI
      package: PyYAML
      url: "https://pypi.org/project/PyYAML/6.0.3/"
    resolution:
      version: "6.0.3"
      lockfile: uv.lock
      digest:
        algorithm: sha256
        artifact: sdist
        value: "d76623373421df22fb4cf8817020cbb7ef15c725b9d5e45f17e189bfc384190f"
    license:
      spdx: MIT
      evidence: "https://raw.githubusercontent.com/yaml/pyyaml/6.0.3/LICENSE"
    upgrade_gate:
      explicit_approval: true
      required_checks: [lock_refresh, license_review, validator_regression]

  - id: jsonschema
    adoption_status: ADOPTED
    decision_status: APPROVED
    integration_mode: BUILD_TOOLING
    role: contract_schema_validator
    source:
      kind: PYPI
      package: jsonschema
      url: "https://pypi.org/project/jsonschema/4.26.0/"
    resolution:
      version: "4.26.0"
      lockfile: uv.lock
      digest:
        algorithm: sha256
        artifact: sdist
        value: "0c26707e2efad8aa1bfc5b7ce170f3fccc2e4918ff85989ba9ffa9facb2be326"
    license:
      spdx: MIT
      evidence: "https://raw.githubusercontent.com/python-jsonschema/jsonschema/v4.26.0/COPYING"
    upgrade_gate:
      explicit_approval: true
      required_checks: [lock_refresh, license_review, schema_regression]

  - id: httpx
    adoption_status: ADOPTED
    decision_status: APPROVED
    integration_mode: ADAPTER
    role: openai_compatible_http_transport
    source:
      kind: PYPI
      package: httpx
      url: "https://pypi.org/project/httpx/0.28.1/"
    resolution:
      version: "0.28.1"
      lockfile: uv.lock
      digest:
        algorithm: sha256
        artifact: sdist
        value: "75e98c5f16b0f35b567856f597f06ff2270a374470a5c2392242528e3e3e42fc"
    license:
      spdx: BSD-3-Clause
      evidence: "https://raw.githubusercontent.com/encode/httpx/0.28.1/LICENSE.md"
    upgrade_gate:
      explicit_approval: true
      required_checks: [lock_refresh, license_review, relay_gateway_regression]

  - id: tenacity
    adoption_status: ADOPTED
    decision_status: APPROVED
    integration_mode: ADAPTER
    role: retry_backoff_policy
    source:
      kind: PYPI
      package: tenacity
      url: "https://pypi.org/project/tenacity/9.1.4/"
    resolution:
      version: "9.1.4"
      lockfile: uv.lock
      digest:
        algorithm: sha256
        artifact: sdist
        value: "adb31d4c263f2bd041081ab33b498309a57c77f9acf2db65aadf0898179cf93a"
    license:
      spdx: Apache-2.0
      evidence: "https://raw.githubusercontent.com/jd/tenacity/9.1.4/LICENSE"
    upgrade_gate:
      explicit_approval: true
      required_checks: [lock_refresh, license_review, relay_gateway_regression]

  - id: openhands_sdk
    adoption_status: PLANNED
    decision_status: APPROVED
    integration_mode: ADAPTER
    role: primary_generic_agent_runtime
    source: "https://github.com/OpenHands/software-agent-sdk"
    controls:
      - pin_exact_version_before_adoption
      - contract_tests
      - policy_wrap_direct_tool_execution
      - manifest_check_on_resume
      - freeze_session_tool_set
      - pin_plugin_revision

  - id: temporal
    adoption_status: PLANNED
    decision_status: DEFERRED
    integration_mode: ADAPTER
    role: durable_workflow
    source: "https://github.com/temporalio/temporal"

  - id: opa
    adoption_status: PLANNED
    decision_status: OPTIONAL
    integration_mode: ADAPTER
    role: centralized_policy_engine
    source: "https://github.com/open-policy-agent/opa"

  - id: opentelemetry
    adoption_status: PLANNED
    decision_status: APPROVED
    integration_mode: STANDARD
    role: telemetry
    source: "https://opentelemetry.io/"
    controls:
      - genai_content_capture_off_by_default

  - id: mcp
    adoption_status: PLANNED
    decision_status: APPROVED
    integration_mode: PROTOCOL
    role: research_tool_integration
    source: "https://modelcontextprotocol.io/"
    controls:
      - roots_not_access_control
      - scoped_authorization
      - schema_version_tracking

  - id: swe_rex
    adoption_status: PLANNED
    decision_status: OPTIONAL
    integration_mode: ADAPTER
    role: remote_parallel_execution
    source: "https://github.com/SWE-agent/SWE-ReX"

  - id: cline_kanban
    adoption_status: PLANNED
    decision_status: REFERENCE_ONLY
    integration_mode: REFERENCE
    role: task_worktree_reference
    source: "https://github.com/cline/kanban"

  - id: claw_ai_lab
    adoption_status: PLANNED
    decision_status: REFERENCE_ONLY
    integration_mode: REFERENCE
    role: research_console_reference
    source: "https://github.com/Claw-AI-Lab/Claw-AI-Lab"
