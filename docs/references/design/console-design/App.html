<!doctype html>
<html lang="en" data-theme="dark" data-density="normal">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Research OS · Control Plane</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"/>
<link rel="stylesheet" href="styles/tokens.css"/>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<!-- data first -->
<script src="data/fixtures.js"></script>

<script type="text/babel" src="screens/Settings.jsx"></script>
<script type="text/babel" src="screens/Notifications.jsx"></script>

<!-- shell + boot -->
<script type="text/babel" src="components/AppShell.jsx"></script>

<script type="text/babel">
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(
    <I18nProvider>
      <GlobalKeyframes/>
      <LoadingCoordinator>
        <AppShell/>
      </LoadingCoordinator>
    </I18nProvider>
  );
</script>

</html>
